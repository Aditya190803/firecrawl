name: Cloudflare Worker
on:
  pull_request:
    paths:
      - 'apps/cf-workers/**'
      - 'apps/cf-console/**'
      - '.github/workflows/test-cf-workers.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cf-workers
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/firecrawl-worker-build
      - name: Verify console mirrors
        run: |
          cmp public/index.html ../cf-console/index.html
          cmp public/index.html ../cf-console/public/index.html
