<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Firecrawl on Cloudflare Workers</title>
<meta name="description" content="A Firecrawl-compatible scrape API running on Cloudflare Workers. Scrape, crawl, map, search, extract, and summarize any site from one endpoint." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#fbfaf9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0c0b0a" media="(prefers-color-scheme: dark)" />
<meta property="og:title" content="Firecrawl on Cloudflare Workers" />
<meta property="og:description" content="Scrape, crawl, map, search, extract, and summarize any site from one endpoint. Docs and playground are open, no account needed." />
<meta property="og:type" content="website" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
/* Shape system: panels 14px, controls 10px, pills round. One accent: ember orange.
   Status colors (ok / bad / warn) carry semantic state only, never decoration. */
:root{
  --bg:#fbfaf9; --bg-soft:#f4f2ef; --panel:#ffffff; --panel-2:#faf9f7;
  --ink:#171310; --ink-2:#6d655c; --ink-3:#968d83;
  --line:#e8e3dc; --line-2:#d9d2c9;
  --accent:#c9400a; --accent-ink:#ffffff; --accent-soft:#fdeee6; --accent-line:#f0b79a;
  --ok:#16794e; --ok-soft:#e7f4ed; --bad:#c22d1c; --bad-soft:#fdecea; --warn:#8f5c06; --warn-soft:#fbf1dc;
  --shadow:0 1px 2px rgba(23,19,16,.05), 0 10px 28px -16px rgba(23,19,16,.22);
  --glow:radial-gradient(58% 70% at 78% 6%, rgba(201,64,10,.13), transparent 70%);
  --r-panel:14px; --r-ctl:10px;
  --sans:"Geist","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono","Cascadia Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --head:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0b0a; --bg-soft:#121110; --panel:#171514; --panel-2:#1c1a18;
    --ink:#f6f3ef; --ink-2:#a49b91; --ink-3:#7d746a;
    --line:#282523; --line-2:#36312d;
    --accent:#ff7a34; --accent-ink:#1a0c04; --accent-soft:#2a1810; --accent-line:#4d2d18;
    --ok:#3ecf8e; --ok-soft:#10231b; --bad:#ff6f61; --bad-soft:#2a1513; --warn:#e6b45c; --warn-soft:#2a2011;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -18px rgba(0,0,0,.9);
    --glow:radial-gradient(58% 70% at 78% 6%, rgba(255,122,52,.16), transparent 70%);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0b0a; --bg-soft:#121110; --panel:#171514; --panel-2:#1c1a18;
  --ink:#f6f3ef; --ink-2:#a49b91; --ink-3:#7d746a;
  --line:#282523; --line-2:#36312d;
  --accent:#ff7a34; --accent-ink:#1a0c04; --accent-soft:#2a1810; --accent-line:#4d2d18;
  --ok:#3ecf8e; --ok-soft:#10231b; --bad:#ff6f61; --bad-soft:#2a1513; --warn:#e6b45c; --warn-soft:#2a2011;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -18px rgba(0,0,0,.9);
  --glow:radial-gradient(58% 70% at 78% 6%, rgba(255,122,52,.16), transparent 70%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0;letter-spacing:-.025em}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono,code,pre{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:var(--ink)}
.brand:hover{text-decoration:none}
.brand .glyph{width:28px;height:28px;border-radius:8px;display:block;flex-shrink:0}
.brand .name{font-weight:600;font-size:15px;letter-spacing:-.02em;white-space:nowrap}
.brand .name span{color:var(--ink-3);font-weight:500}

/* ---------- marketing nav ---------- */
.nav{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;
  background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:22px;width:100%}
.nav .links{display:flex;align-items:center;gap:20px;margin-left:12px}
.nav .links a{color:var(--ink-2);font-size:14px;font-weight:500}
.nav .links a:hover{color:var(--ink);text-decoration:none}
.nav .links a.here{color:var(--ink)}
.nav .right{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ---------- buttons and inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-weight:500;font-size:14px;cursor:pointer;
  white-space:nowrap;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:var(--r-ctl);
  padding:9px 14px;transition:background .15s var(--ease),border-color .15s var(--ease),transform .08s var(--ease)}
.btn i{font-size:16px}
.btn:hover{background:var(--bg-soft);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--bg-soft);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--line-2);color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.lg{padding:12px 20px;font-size:15px}
.btn.icon{padding:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.field .flabel,.flabel{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
input[type=text],input[type=password],input[type=email],input[type=number],textarea,select{
  width:100%;font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-2);
  border-radius:var(--r-ctl);padding:9px 12px;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{min-height:84px;resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.5}
input.tiny{padding:6px 8px;font-size:13px;font-family:var(--mono)}

/* ---------- shared surfaces ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow)}
.panel + .panel{margin-top:14px}
.panel-hd{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-hd h2{font-size:14.5px;font-weight:600}
.panel-hd .note{margin-left:auto;color:var(--ink-3);font-size:12.5px}
.panel-bd{padding:18px}
pre.out{margin:0;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-ctl);padding:14px;
  font-size:12.5px;line-height:1.6;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word}
.tok-key{color:var(--accent)}.tok-str{color:var(--ok)}.tok-num{color:var(--warn)}.tok-lit{color:var(--ink-3)}
.verb{font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px}
.verb.POST{color:var(--ok);background:var(--ok-soft)}
.verb.GET{color:var(--accent);background:var(--accent-soft)}
.verb.DELETE{color:var(--bad);background:var(--bad-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;
  padding:3px 9px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--panel-2)}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.chip.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.accent{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.callout{display:flex;gap:10px;border-radius:var(--r-ctl);padding:12px 14px;font-size:13.5px;margin-bottom:14px;line-height:1.5}
.callout i{font-size:17px;flex-shrink:0;margin-top:1px}
.callout.err{background:var(--bad-soft);color:var(--bad)}
.callout.info{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex-shrink:0}
.dot.up{background:var(--ok)}.dot.down{background:var(--bad)}

/* ---------- landing ---------- */
.hero{background-image:var(--glow);padding:72px 0 64px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:52px;align-items:center}
.hero h1{font-size:clamp(34px,4.4vw,56px);line-height:1.05;font-weight:600;max-width:15ch}
.hero .lede{margin-top:18px;color:var(--ink-2);font-size:17px;line-height:1.55;max-width:46ch}
.hero .cta{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.widget{border:1px solid var(--line);border-radius:var(--r-panel);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.widget .bar{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.widget .bar .p{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.widget .bar .live{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.widget .bd{padding:14px}
.widget .go{display:flex;gap:8px}
.widget .go input{flex:1}
.widget pre.out{margin-top:12px;max-height:232px;font-size:12px}
.section{padding:72px 0;border-top:1px solid var(--line)}
.section h2{font-size:clamp(25px,2.6vw,33px);font-weight:600;max-width:20ch}
.section .sub{margin-top:12px;color:var(--ink-2);font-size:16px;max-width:62ch}
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-top:34px}
.tile{border:1px solid var(--line);border-radius:var(--r-panel);padding:20px;background:var(--panel);
  display:flex;flex-direction:column;gap:8px;transition:transform .2s var(--ease),border-color .2s var(--ease)}
.tile:hover{transform:translateY(-2px);border-color:var(--accent-line)}
.tile i{font-size:22px;color:var(--accent)}
.tile h3{font-size:16px;font-weight:600}
.tile p{color:var(--ink-2);font-size:13.5px}
.tile code{font-size:12px;color:var(--ink-3)}
.tile.wide{grid-column:span 3}
.tile.third{grid-column:span 2}
.tile.tint{background:linear-gradient(150deg,var(--accent-soft),var(--panel) 72%);border-color:var(--accent-line)}
.tile.ink{background:linear-gradient(150deg,var(--bg-soft),var(--panel) 80%)}
.tile pre{margin:6px 0 0;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-ctl);
  padding:10px 12px;font-size:11.5px;overflow:auto;line-height:1.5}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:13px;font-weight:500;cursor:pointer;border-radius:999px;padding:6px 13px;
  border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);transition:all .15s var(--ease)}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.facts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:48px;align-items:start}
.factgroup + .factgroup{margin-top:26px;border-top:1px solid var(--line);padding-top:26px}
.factgroup h3{font-size:13px;font-weight:600;color:var(--ink-3);margin-bottom:12px}
.factgroup dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 20px}
.factgroup dt{font-family:var(--mono);font-size:13px;color:var(--ink)}
.factgroup dd{margin:0;color:var(--ink-2);font-size:13.5px}
.band{margin:0 0 72px;padding:44px 36px;border:1px solid var(--accent-line);border-radius:var(--r-panel);
  background:linear-gradient(135deg,var(--accent-soft),var(--panel) 75%);display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.band h2{font-size:26px;font-weight:600;max-width:22ch}
.band p{color:var(--ink-2);margin-top:8px;max-width:54ch}
.band .btn{margin-left:auto}
footer{border-top:1px solid var(--line);background:var(--bg-soft);padding:40px 0}
footer .cols{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:28px}
footer h4{font-size:12px;font-weight:600;color:var(--ink-3);margin:0 0 10px}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer a,footer li{font-size:13.5px;color:var(--ink-2)}
footer .about{color:var(--ink-2);font-size:13.5px;max-width:34ch;margin-top:12px}

/* ---------- docs ---------- */
.docs{display:grid;grid-template-columns:212px minmax(0,1fr);gap:44px;padding:36px 0 80px}
.docnav{position:sticky;top:132px;align-self:start;display:flex;flex-direction:column;gap:2px;
  max-height:calc(100dvh - 160px);overflow:auto}
.docnav b{font-size:12px;color:var(--ink-3);font-weight:600;margin:14px 0 6px}
.docnav b:first-child{margin-top:0}
.docnav a{color:var(--ink-2);font-size:13.5px;padding:6px 10px;border-radius:8px}
.docnav a:hover{background:var(--bg-soft);color:var(--ink);text-decoration:none}
.doc h1{font-size:32px;font-weight:600}
.doc .lede{margin-top:10px;color:var(--ink-2);font-size:16px;max-width:62ch}
.ep{padding-top:44px;margin-top:44px;border-top:1px solid var(--line)}
.ep h2{font-size:22px;font-weight:600}
.ep .sig{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:var(--mono);font-size:13.5px;color:var(--ink-2)}
.ep .desc{margin-top:12px;color:var(--ink-2);max-width:64ch}
.ep .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:18px;align-items:start}
.params{margin-top:18px;border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden}
.params .p{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:16px;padding:11px 16px;font-size:13.5px}
.params .p + .p{border-top:1px solid var(--line)}
.params .n{font-family:var(--mono);color:var(--ink)}
.params .n em{font-style:normal;color:var(--ink-3);font-size:12px;display:block;margin-top:2px}
.params .d{color:var(--ink-2)}
.try{border:1px solid var(--line);border-radius:var(--r-panel);background:var(--panel-2);padding:16px;margin-top:18px}
.try .hd{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.try .hd h3{font-size:13.5px;font-weight:600}
.try .hd .note{margin-left:auto;font-size:12px;color:var(--ink-3)}
.keybar{position:sticky;top:64px;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0}
.keybar .wrap{display:flex;align-items:center;gap:12px}
.keybar label{font-size:12.5px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.keybar input{max-width:360px;font-family:var(--mono);font-size:13px}
.keybar .state{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}

/* ---------- console ---------- */
.top{position:sticky;top:0;z-index:30;height:var(--head);display:flex;align-items:center;gap:16px;padding:0 20px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .brand{width:220px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.host{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;color:var(--ink-2);
  border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;max-width:340px}
.host b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr)}
.side{position:sticky;top:var(--head);height:calc(100dvh - var(--head));border-right:1px solid var(--line);
  padding:18px 14px;display:flex;flex-direction:column;gap:2px;background:var(--bg-soft)}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-ctl);color:var(--ink-2);
  font-weight:500;font-size:14px;transition:background .15s var(--ease),color .15s var(--ease)}
.side a i{font-size:17px}
.side a:hover{background:var(--panel);color:var(--ink);text-decoration:none}
.side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .who{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.side .who .mail{font-size:12.5px;color:var(--ink-2);word-break:break-all;line-height:1.35}
.main{padding:30px 34px 80px;max-width:1180px;min-width:0}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:25px;font-weight:600}
.head p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.head .acts{margin-left:auto;display:flex;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-panel);padding:16px 18px;box-shadow:var(--shadow)}
.stat .k{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);font-weight:500}
.stat .k i{font-size:14px;color:var(--ink-3)}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:27px;font-weight:600;letter-spacing:-.03em;margin-top:8px}
.stat .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);
  padding:11px 18px;border-bottom:1px solid var(--line);background:var(--panel-2)}
td{padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel-2)}
.sub2{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.reveal-key{background:var(--panel);border:1px solid var(--accent-line);border-radius:var(--r-panel);padding:16px 18px;margin-bottom:14px}
.reveal-key b{display:block;font-size:13.5px;margin-bottom:8px}
.reveal-key code{display:block;font-size:13.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-ctl);
  padding:10px 12px;word-break:break-all;margin-bottom:10px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:38px 20px;color:var(--ink-2)}
.empty i{font-size:26px;color:var(--ink-3)}
.empty b{font-weight:600;color:var(--ink);font-size:14px}
.empty p{font-size:13px;max-width:44ch}
.sk{background:linear-gradient(90deg,var(--panel-2),var(--bg-soft),var(--panel-2));background-size:200% 100%;border-radius:8px;height:14px}
.chart{width:100%;height:150px;display:block}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .hit:hover{fill:var(--accent-soft)}
.legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);font-family:var(--mono);margin-top:6px}

/* ---------- auth ---------- */
.auth{min-height:calc(100dvh - 64px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.auth .pitch{background:var(--bg-soft);border-right:1px solid var(--line);padding:56px 48px;display:flex;
  flex-direction:column;gap:22px;justify-content:center}
.auth .pitch h2{font-size:30px;font-weight:600;line-height:1.15;max-width:16ch}
.auth .pitch ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.auth .pitch li{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2)}
.auth .pitch li i{color:var(--accent);font-size:18px;margin-top:1px}
.auth .form{display:grid;place-items:center;padding:40px 24px}
.auth .form .inner{width:min(380px,100%)}
.auth .form h1{font-size:24px;font-weight:600;margin-bottom:6px}
.auth .form .lede{color:var(--ink-2);font-size:14px;margin:0 0 22px}

/* ---------- toast ---------- */
.toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-ctl);
  box-shadow:var(--shadow);padding:11px 14px;font-size:13.5px;max-width:340px}
.toast i{font-size:17px}
.toast.ok i{color:var(--ok)}.toast.bad i{color:var(--bad)}

/* ---------- motion: hero entry for hierarchy, scroll reveal for structure ---------- */
@media (prefers-reduced-motion: no-preference){
  .rise{animation:rise .55s var(--ease) backwards}
  .rise.d1{animation-delay:.07s}.rise.d2{animation-delay:.14s}.rise.d3{animation-delay:.21s}
  [data-reveal]{opacity:0;transform:translateY(16px)}
  [data-reveal].in{opacity:1;transform:none;transition:opacity .6s var(--ease),transform .6s var(--ease)}
  .toast{animation:rise .24s var(--ease)}
  .sk{animation:sh 1.4s linear infinite}
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:1080px){
  .hero .wrap{grid-template-columns:minmax(0,1fr);gap:36px}
  .hero h1{max-width:20ch}
  .facts{grid-template-columns:minmax(0,1fr);gap:28px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols,.cols.even,.ep .split{grid-template-columns:minmax(0,1fr)}
  .tile.wide,.tile.third{grid-column:span 3}
  .docs{grid-template-columns:minmax(0,1fr);gap:24px}
  .docnav{position:static;flex-direction:row;flex-wrap:wrap;max-height:none;gap:6px}
  .docnav b{display:none}
  .docnav a{border:1px solid var(--line);border-radius:999px}
  footer .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .nav .links{display:none}
  .hero{padding:48px 0 40px}
  .section{padding:52px 0}
  .tile,.tile.wide,.tile.third{grid-column:span 6}
  .band{flex-direction:column;align-items:flex-start;padding:28px 22px}
  .band .btn{margin-left:0}
  .layout{grid-template-columns:1fr}
  .top .brand{width:auto}
  .host{display:none}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;gap:6px}
  .side .who{margin:0 0 0 auto;border-top:0;padding:0;flex-direction:row;align-items:center}
  .side .who .mail{display:none}
  .main{padding:22px 16px 64px}
  .auth{grid-template-columns:1fr}
  .auth .pitch{display:none}
  .params .p{grid-template-columns:minmax(0,1fr);gap:4px}
  .keybar .state{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script>
"use strict";

/* ---------------- primitives ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
/* Served from the Worker custom domain, so the origin is the API. The same file is
   mirrored on Cloudflare Pages, where the origin is not the API: fall back to the
   Worker domain there. The console header can point it anywhere. */
const WORKER_ORIGIN="https://firecrawl.adityamer.dev";
const API=()=>(localStorage.getItem("fc_base")
  ||(/\.pages\.dev$/.test(location.hostname)?WORKER_ORIGIN:window.location.origin)).replace(/\/$/,"");
const TOKEN=()=>localStorage.getItem("fc_token")||"";
const ROLE=()=>localStorage.getItem("fc_role")||"";
const EMAIL=()=>localStorage.getItem("fc_email")||"";
const KEY=()=>localStorage.getItem("fc_lastkey")||"";
const GLYPH=`<svg class="glyph" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="fcT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#e2430f"/></linearGradient><linearGradient id="fcC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a8"/><stop offset="1" stop-color="#ff7a2f"/></linearGradient></defs><rect width="32" height="32" rx="7.5" fill="url(#fcT)"/><path fill="#fff" d="M17.3 3.4c.5 3.1-.6 5.2-2.6 7.2-2.6 2.5-4.8 4.6-4.8 8.1a6.1 6.1 0 0 0 12.2.3c0-2.6-1.1-4.2-2-5.7.9.2 1.7.7 2.3 1.4.3-3.9-1.7-8.2-5.1-11.3Z"/><path fill="url(#fcC)" d="M16.1 16.1c.6 1.7 2.4 2.4 2.4 4.3a2.8 2.8 0 0 1-5.6.1c0-1.4.8-2.2 1.5-3 .6-.7 1.2-1.4 1.7-1.4Z"/></svg>`;
const brandLink=(sub="")=>`<a class="brand" href="#/">${GLYPH}<div class="name">Firecrawl${sub?` <span>${esc(sub)}</span>`:""}</div></a>`;

const authH=()=>({"content-type":"application/json",...(TOKEN()?{authorization:"Bearer "+TOKEN()}:{})});
async function api(path,opts={}){
  const r=await fetch(API()+path,{...opts,headers:{...(opts.headers||{}),...authH()}});
  const j=await r.json().catch(()=>({success:false,error:"Response was not JSON."}));
  if(r.status===401&&path.startsWith("/dashboard/")&&!path.includes("accept-invite")&&!path.includes("login")){
    logout();location.hash="#/login";
  }
  return {status:r.status,j};
}
function logout(){["fc_token","fc_email","fc_role"].forEach(k=>localStorage.removeItem(k));}
function remember(d){localStorage.setItem("fc_token",d.token);localStorage.setItem("fc_email",d.email);if(d.role)localStorage.setItem("fc_role",d.role);}

function toast(msg,kind="ok"){
  const el=document.createElement("div");
  el.className="toast "+kind;
  el.innerHTML=`<i class="ph-fill ${kind==="bad"?"ph-warning-circle":"ph-check-circle"}" aria-hidden="true"></i><span>${esc(msg)}</span>`;
  $("#toasts").appendChild(el);
  setTimeout(()=>el.remove(),3200);
}
function copy(text,btn,label="Copied"){
  navigator.clipboard.writeText(text).then(()=>{
    toast(label);
    if(btn){const o=btn.innerHTML;btn.innerHTML=`<i class="ph ph-check" aria-hidden="true"></i>${label}`;setTimeout(()=>btn.innerHTML=o,1400);}
  }).catch(()=>toast("Clipboard blocked by the browser.","bad"));
}
function hi(value){
  return esc(JSON.stringify(value,null,2))
    .replace(/&quot;([^&]*?)&quot;(\s*:)/g,'<span class="tok-key">&quot;$1&quot;</span>$2')
    .replace(/:\s(&quot;.*?&quot;)/g,': <span class="tok-str">$1</span>')
    .replace(/:\s(-?\d+\.?\d*)/g,': <span class="tok-num">$1</span>')
    .replace(/:\s(true|false|null)/g,': <span class="tok-lit">$1</span>');
}
const shortDate=s=>esc(String(s||"").slice(0,16).replace("T"," "));
const skeleton=rows=>`<div class="panel"><div class="panel-bd">${Array.from({length:rows},(_,i)=>
  `<div class="sk" style="width:${[92,70,84,58][i%4]}%;margin-bottom:12px"></div>`).join("")}</div></div>`;

/* Reveal sections as they enter the viewport: it shows page structure while scrolling.
   IntersectionObserver, never a scroll listener, and skipped under reduced motion. */
let revealObserver=null;
function wireReveal(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  revealObserver?.disconnect();
  revealObserver=new IntersectionObserver((entries,obs)=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");obs.unobserve(e.target);}});
  },{threshold:.12});
  $$("[data-reveal]").forEach(el=>revealObserver.observe(el));
}

/* ---------------- theme ---------------- */
function theme(){return localStorage.getItem("fc_theme")||"system";}
function applyTheme(){
  const t=theme();
  if(t==="system")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
}
function cycleTheme(){
  const order=["system","light","dark"];
  localStorage.setItem("fc_theme",order[(order.indexOf(theme())+1)%3]);
  applyTheme();render();toast("Theme: "+theme());
}
const themeIcon=()=>({system:"ph-circle-half",light:"ph-sun",dark:"ph-moon"})[theme()];
const themeBtn=()=>`<button class="btn icon quiet" id="themeBtn" title="Theme: ${theme()}" aria-label="Change theme"><i class="ph ${themeIcon()}" aria-hidden="true"></i></button>`;
applyTheme();

/* ---------------- endpoint catalog: powers the tiles, the docs, and the playground ---------------- */
const EPS=[
  {id:"scrape",group:"Scraping",title:"Scrape a page",method:"POST",path:"/v2/scrape",icon:"ph-file-text",
   blurb:"Fetch one page and get markdown, HTML, plain text, or its links.",
   params:[["url","string, required","Absolute URL. A bare host gets https:// added."],
           ["formats","array","Any of markdown, html, rawHtml, text, links, summary."],
           ["onlyMainContent","boolean","Strips navigation and footers. On by default."],
           ["timeout","number","Milliseconds, up to 120000."]],
   form:[["url","text","https://example.com"],["formats","textarea",'[{"type":"markdown"}]']],
   example:{url:"https://example.com",formats:[{type:"markdown"}]}},
  {id:"crawl",group:"Scraping",title:"Crawl a site",method:"POST",path:"/v2/crawl",icon:"ph-tree-structure",async:"crawl",
   blurb:"Walk a site from one URL and scrape every page it finds. Returns a job to poll.",
   params:[["url","string, required","Where the crawl starts."],
           ["limit","number","Maximum pages. Defaults to 100."],
           ["maxDepth","number","Link depth from the start URL. Defaults to 5."],
           ["excludePaths","array","Path patterns to skip."]],
   form:[["url","text","https://example.com"],["limit","number","5"],["maxDepth","number","2"]],
   example:{url:"https://example.com",limit:20,maxDepth:2}},
  {id:"batch",group:"Scraping",title:"Batch scrape",method:"POST",path:"/v2/batch/scrape",icon:"ph-stack",async:"batch/scrape",
   blurb:"Scrape a list of URLs in one job, with the options a single scrape takes.",
   params:[["urls","array, required","Up to 1000 URLs."],
           ["formats","array","Applied to every URL in the batch."],
           ["maxConcurrency","number","Up to 10 pages at a time."]],
   form:[["urls","textarea","https://example.com\nhttps://example.org"]],
   example:{urls:["https://example.com","https://example.org"]}},
  {id:"map",group:"Discovery",title:"Map a site",method:"POST",path:"/v2/map",icon:"ph-sitemap",
   blurb:"List the URLs of a site from its sitemap and homepage links, without scraping.",
   params:[["url","string, required","Site to map."],
           ["limit","number","Maximum URLs returned."],
           ["search","string","Keep only URLs containing this text."],
           ["includeSubdomains","boolean","On by default."]],
   form:[["url","text","https://example.com"],["limit","number","10"]],
   example:{url:"https://example.com",limit:50}},
  {id:"search",group:"Discovery",title:"Search the web",method:"POST",path:"/v2/search",icon:"ph-magnifying-glass",
   blurb:"Run a web search through the configured provider. DuckDuckGo needs no key.",
   params:[["query","string, required","What to search for."],
           ["limit","number","Results to return. Defaults to 10."],
           ["country","string","Two letter country code."],
           ["scrapeOptions","object","Scrape each result as well."]],
   form:[["query","text","firecrawl workers"],["limit","number","5"]],
   example:{query:"firecrawl",limit:5}},
  {id:"extract",group:"AI",title:"Extract fields",method:"POST",path:"/v2/extract",icon:"ph-brackets-curly",
   blurb:"Pull structured values out of pages with Workers AI, guided by a prompt.",
   params:[["urls","array, required","Pages to read. A single url also works."],
           ["prompt","string","What to pull out of each page."],
           ["schema","object","JSON shape the answer should follow."]],
   form:[["urls","textarea","https://example.com"],["prompt","text","What is this page about?"]],
   example:{urls:["https://example.com"],prompt:"Give the product name and price."}},
  {id:"summarize",group:"AI",title:"Summarize a page",method:"POST",path:"/v2/summarize",icon:"ph-article",
   blurb:"Short summary of one page. Falls back to an extractive summary when AI is off.",
   params:[["url","string, required","Page to summarize."],
           ["sentences","number","Between 1 and 10. Defaults to 3."]],
   form:[["url","text","https://example.com"],["sentences","number","3"]],
   example:{url:"https://example.com",sentences:3}},
  {id:"status",group:"Jobs",title:"Check a job",method:"GET",path:"/v2/crawl/:jobId",icon:"ph-clock-countdown",
   blurb:"Status, progress, scraped data, and per-page errors for a crawl or batch job.",
   params:[["jobId","string, required","Returned by crawl and batch scrape."]],
   form:[["jobId","text",""]],
   raw:b=>`/v2/crawl/${b.jobId}`,example:null},
];
const EP=id=>EPS.find(e=>e.id===id);
const buildBody=(spec,read)=>{
  const o={};
  spec.form.forEach(([name,kind])=>{
    const v=read(name);
    if(name==="formats"){try{o.formats=JSON.parse(v)}catch{o.formats=[{type:"markdown"}]}}
    else if(name==="urls"){o.urls=v.split("\n").map(s=>s.trim()).filter(Boolean)}
    else if(kind==="number"){if(v!=="")o[name]=Number(v)}
    else o[name]=v;
  });
  return o;
};
const curlFor=(spec,body)=>{
  const path=spec.raw?spec.raw(body):spec.path;
  return spec.method==="GET"
    ? `curl -s ${API()}${path} \\\n  -H "Authorization: Bearer $FIRECRAWL_KEY"`
    : `curl -s -X ${spec.method} ${API()}${spec.path} \\\n  -H "Authorization: Bearer $FIRECRAWL_KEY" \\\n  -H "content-type: application/json" \\\n  -d '${JSON.stringify(body)}'`;
};

/* ---------------- routing: landing, docs and login are public ---------------- */
const CONSOLE_PAGES={
  "/overview":{title:"Overview",icon:"ph-chart-line-up",view:vOverview},
  "/keys":{title:"API keys",icon:"ph-key",view:vKeys},
  "/people":{title:"People",icon:"ph-users-three",view:vPeople,admin:true},
};
function parseRoute(){
  const raw=(location.hash||"#/").slice(1);
  const inv=raw.match(/^\/invite\/(.+)$/);
  if(inv)return {name:"/invite",token:decodeURIComponent(inv[1])};
  const [path,anchor]=raw.split("#");
  if(path==="/"||path==="")return {name:"/",anchor};
  return {name:path,anchor};
}
const setTitle=t=>document.title=t?t+" · Firecrawl":"Firecrawl on Cloudflare Workers";

let renderedRoute=null;
async function render(){
  const r=parseRoute();
  const isConsole=!!CONSOLE_PAGES[r.name];
  if(renderedRoute===r.name&&r.anchor){
    const same=document.getElementById(r.anchor);
    if(same){same.scrollIntoView();return;}
  }
  if(isConsole&&!TOKEN()){location.hash="#/login";return;}
  if(r.name==="/login"&&TOKEN()){location.hash="#/overview";return;}

  if(r.name==="/"){setTitle("");vLanding();}
  else if(r.name==="/docs"){setTitle("Docs");vDocs();}
  else if(r.name==="/login"){setTitle("Sign in");vLogin();}
  else if(r.name==="/invite"){setTitle("Set your password");vInvite(r.token);}
  else if(isConsole){
    const page=CONSOLE_PAGES[r.name];
    setTitle(page.title+" · Console");
    $("#root").innerHTML=consoleChrome(skeleton(5));
    wireConsole();
    await page.view($("#view"));
  }
  else {location.hash="#/";return;}

  renderedRoute=r.name;
  wireReveal();
  const target=r.anchor&&document.getElementById(r.anchor);
  if(target)target.scrollIntoView();
  else window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

/* ---------------- public chrome ---------------- */
function siteNav(current){
  const right=TOKEN()
    ? `<a class="btn sm" href="#/overview"><i class="ph ph-gauge" aria-hidden="true"></i>Console</a>`
    : `<a class="btn sm primary" href="#/login">Sign in</a>`;
  return `<nav class="nav"><div class="wrap">
    ${brandLink()}
    <div class="links">
      <a href="#/docs" class="${current==="docs"?"here":""}">Docs</a>
      <a href="#/docs#playground">Playground</a>
      <a href="#/docs#errors">Errors</a>
    </div>
    <div class="right">${themeBtn()}${right}</div>
  </div></nav>`;
}
function siteFooter(){
  return `<footer><div class="wrap cols">
    <div>${brandLink()}<p class="about">A Firecrawl-compatible scrape API running on Cloudflare Workers, D1, KV, and Queues.</p></div>
    <div><h4>Endpoints</h4><ul>
      <li><a href="#/docs#scrape">Scrape</a></li><li><a href="#/docs#crawl">Crawl</a></li>
      <li><a href="#/docs#map">Map</a></li><li><a href="#/docs#search">Search</a></li></ul></div>
    <div><h4>Reference</h4><ul>
      <li><a href="#/docs#auth">Authentication</a></li><li><a href="#/docs#playground">Playground</a></li>
      <li><a href="#/docs#errors">Error codes</a></li><li><a href="/docs">Machine catalog</a></li></ul></div>
    <div><h4>Account</h4><ul>
      <li><a href="#/login">Sign in</a></li><li><a href="/health">Health</a></li></ul></div>
  </div></footer>`;
}
function wireSite(){
  const t=$("#themeBtn");if(t)t.onclick=cycleTheme;
}
async function pulse(){
  const d=$("#pulse"),t=$("#pulsetxt");if(!d)return;
  try{const r=await fetch(API()+"/health");d.className="dot "+(r.ok?"up":"down");if(t)t.textContent=r.ok?"live":"HTTP "+r.status;}
  catch{d.className="dot down";if(t)t.textContent="unreachable";}
}

/* ---------------- landing ---------------- */
function vLanding(){
  const tiles=[["scrape","tile wide tint"],["crawl","tile wide ink"],["map","tile third"],
    ["search","tile third"],["extract","tile third"],["summarize","tile wide"],["batch","tile wide"]];
  $("#root").innerHTML=`${siteNav()}
  <header class="hero"><div class="wrap">
    <div>
      <h1 class="rise">Any site, clean markdown, one call.</h1>
      <p class="lede rise d1">A Firecrawl-compatible API on Cloudflare Workers. Scrape, crawl, map, search, extract, and summarize.</p>
      <div class="cta rise d2">
        <a class="btn primary lg" href="#/docs">Read the docs</a>
        <a class="btn lg" href="#/login">Sign in</a>
      </div>
    </div>
    <div class="widget rise d3">
      <div class="bar"><span class="verb POST">POST</span><span class="p">/v2/scrape</span>
        <span class="live"><span class="dot" id="pulse"></span><b id="pulsetxt">checking</b></span></div>
      <div class="bd">
        <div class="go">
          <label for="heroUrl" class="sr">URL to scrape</label>
          <input type="text" id="heroUrl" value="https://example.com" spellcheck="false"/>
          <button class="btn primary" id="heroRun"><i class="ph ph-play" aria-hidden="true"></i>Run</button>
        </div>
        <pre class="out" id="heroOut">This form calls the live API. Add a key in the playground, then run it from here.</pre>
      </div>
    </div>
  </div></header>

  <section class="section" data-reveal><div class="wrap">
    <h2>Seven endpoints, one key.</h2>
    <p class="sub">Each one answers in the Firecrawl v2 response shape, so an existing SDK client works by changing the base URL and nothing else.</p>
    <div class="bento">
      ${tiles.map(([id,cls])=>{const e=EP(id);return `<article class="${cls}">
        <i class="ph ${e.icon}" aria-hidden="true"></i>
        <h3>${esc(e.title)}</h3>
        <p>${esc(e.blurb)}</p>
        ${cls.includes("wide")&&e.example?`<pre>${hi(e.example)}</pre>`:`<code>${esc(e.method)} ${esc(e.path)}</code>`}
      </article>`;}).join("")}
    </div>
  </div></section>

  <section class="section" data-reveal><div class="wrap">
    <h2>Start with three lines.</h2>
    <p class="sub">Point any Firecrawl client at this host, or call it directly with curl.</p>
    <div class="panel" style="margin-top:28px">
      <div class="panel-hd"><div class="tabs" id="qtabs" role="group" aria-label="Language"></div>
        <button class="btn sm" id="qcopy" style="margin-left:auto"><i class="ph ph-copy" aria-hidden="true"></i>Copy</button></div>
      <div class="panel-bd"><pre class="out" id="qcode" style="max-height:none"></pre></div>
    </div>
  </div></section>

  <section class="section" data-reveal><div class="wrap facts">
    <div>
      <h2>Built to stay on the free tier.</h2>
      <p class="sub">Workers runs the API, D1 holds keys and jobs, KV caches pages, Queues carries crawls, Workers AI does extraction. Browser rendering is left out on purpose because it needs a paid plan.</p>
    </div>
    <div>
      <div class="factgroup"><h3>Limits you set</h3><dl>
        <dt>rate limit</dt><dd>Requests per minute, per key.</dd>
        <dt>monthly cap</dt><dd>Credit ceiling per key, or none at all.</dd>
        <dt>crawl size</dt><dd>Page and depth ceilings from worker config.</dd>
      </dl></div>
      <div class="factgroup"><h3>Access</h3><dl>
        <dt>docs</dt><dd>Open to everyone, playground included.</dd>
        <dt>keys</dt><dd>Created in the console, shown once.</dd>
        <dt>accounts</dt><dd>Invite only. There is no public signup.</dd>
      </dl></div>
    </div>
  </div></section>

  <div class="wrap"><section class="band" data-reveal>
    <div><h2>Keys, usage, and limits live in the console.</h2>
      <p>Issue a key per environment, watch credits by endpoint, and invite the people who need access.</p></div>
    <a class="btn primary lg" href="#/login">Sign in</a>
  </section></div>
  ${siteFooter()}`;
  wireSite();
  pulse();

  /* Hero widget calls the real scrape endpoint. Nothing here is a mock preview. */
  $("#heroRun").onclick=async ev=>{
    const btn=ev.currentTarget,out=$("#heroOut"),url=$("#heroUrl").value.trim();
    if(!url){out.textContent="Enter a URL first.";return;}
    btn.disabled=true;out.textContent="Scraping...";
    const t0=performance.now();
    try{
      const r=await fetch(API()+"/v2/scrape",{method:"POST",
        headers:{"content-type":"application/json",...(KEY()?{authorization:"Bearer "+KEY()}:{})},
        body:JSON.stringify({url,formats:[{type:"markdown"}]})});
      const j=await r.json().catch(()=>({}));
      const md=j&&j.data&&j.data.markdown;
      out.innerHTML=r.ok&&md
        ? `<span class="tok-lit">HTTP ${r.status} in ${Math.round(performance.now()-t0)} ms</span>\n\n`+esc(md.slice(0,900))
        : hi(j);
      if(r.status===401)toast("Add an API key in the playground first.","bad");
    }catch(e){out.textContent=e.message;}
    finally{btn.disabled=false;}
  };

  const SNIPPETS={
    curl:()=>`curl -s -X POST ${API()}/v2/scrape \\\n  -H "Authorization: Bearer $FIRECRAWL_KEY" \\\n  -H "content-type: application/json" \\\n  -d '{"url":"https://example.com","formats":[{"type":"markdown"}]}'`,
    javascript:()=>`import Firecrawl from "@mendable/firecrawl-js";\n\nconst firecrawl = new Firecrawl({\n  apiKey: process.env.FIRECRAWL_KEY,\n  apiUrl: "${API()}",\n});\n\nconst doc = await firecrawl.scrape("https://example.com", { formats: ["markdown"] });`,
    python:()=>`from firecrawl import FirecrawlApp\n\napp = FirecrawlApp(\n    api_key=os.environ["FIRECRAWL_KEY"],\n    api_url="${API()}",\n)\n\ndoc = app.scrape_url("https://example.com", formats=["markdown"])`,
  };
  let lang="curl";
  const drawQ=()=>{
    $("#qtabs").innerHTML=Object.keys(SNIPPETS).map(k=>
      `<button type="button" data-l="${k}" aria-pressed="${k===lang}">${k}</button>`).join("");
    $$("#qtabs button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;drawQ();});
    $("#qcode").textContent=SNIPPETS[lang]();
  };
  drawQ();
  $("#qcopy").onclick=ev=>copy(SNIPPETS[lang](),ev.currentTarget);
}

const pollTimers={};
async function runEndpoint(spec,read,btn){
  const out=$("#out_"+spec.id),meta=$("#meta_"+spec.id),pollBox=$("#poll_"+spec.id);
  clearInterval(pollTimers[spec.id]);pollBox.innerHTML="";
  const body=buildBody(spec,read);
  const keyField=$("#dkey");
  const key=((keyField&&keyField.value)||KEY()).trim();
  if(spec.id==="status"&&!body.jobId){
    meta.innerHTML=`<span class="chip bad">jobId missing</span>`;
    out.textContent="Run a crawl or a batch scrape first, then paste the job ID here.";return;
  }
  btn.disabled=true;out.textContent="Waiting for the worker...";
  const t0=performance.now();
  try{
    const path=spec.raw?spec.raw(body):spec.path;
    const opts={method:spec.method,headers:{"content-type":"application/json",...(key?{authorization:"Bearer "+key}:{})}};
    if(spec.method!=="GET")opts.body=JSON.stringify(body);
    const r=await fetch(API()+path,opts);
    const j=await r.json().catch(()=>({}));
    paint(spec.id,r.status,Math.round(performance.now()-t0),j);
    if(r.status===401)toast("That request needs a valid API key.","bad");
    if(j&&j.id&&spec.async)startPoll(spec,j.id);
  }catch(e){
    meta.innerHTML=`<span class="chip bad">failed</span>`;
    out.textContent=e.message;
  }finally{btn.disabled=false;}
}
function paint(id,status,ms,j){
  const ok=status>=200&&status<300;
  const size=new Blob([JSON.stringify(j)]).size;
  $("#meta_"+id).innerHTML=`<span class="chip ${ok?"ok":"bad"}">HTTP ${status}</span> <span class="mono" style="color:var(--ink-3)">${ms?ms+" ms":""} ${size>1024?(size/1024).toFixed(1)+" kB":size+" B"}</span>`;
  $("#out_"+id).innerHTML=hi(j);
}
function startPoll(spec,jobId){
  const box=$("#poll_"+spec.id),t0=Date.now();
  const jobField=$("#f_status_jobId");if(jobField)jobField.value=jobId;
  pollTimers[spec.id]=setInterval(async()=>{
    box.innerHTML=`<div class="callout info" style="margin:0"><i class="ph ph-arrows-clockwise" aria-hidden="true"></i><span>Polling ${esc(spec.async)}/${esc(jobId)} for ${Math.round((Date.now()-t0)/1000)}s</span></div>`;
    try{
      const keyField=$("#dkey");
      const key=((keyField&&keyField.value)||KEY()).trim();
      const r=await fetch(`${API()}/v2/${spec.async}/${jobId}`,{headers:key?{authorization:"Bearer "+key}:{}});
      const j=await r.json();
      paint(spec.id,r.status,0,j);
      if(["completed","failed","cancelled"].includes(j.status)){
        clearInterval(pollTimers[spec.id]);box.innerHTML="";toast("Job "+j.status+".",j.status==="completed"?"ok":"bad");
      }
    }catch{}
    if(Date.now()-t0>120000){
      clearInterval(pollTimers[spec.id]);
      box.innerHTML=`<div class="callout info" style="margin:0"><i class="ph ph-clock-countdown" aria-hidden="true"></i><span>Stopped polling after 2 minutes. The job may still be running.</span></div>`;
    }
  },2500);
}

function areaChart(daily){
  const pts=(daily||[]).map(d=>d.credits);
  if(!pts.length)return `<div class="empty"><i class="ph ph-chart-line" aria-hidden="true"></i><b>No traffic yet</b><p>Run a request from the playground and the daily curve shows up here.</p></div>`;
  const w=600,h=150,pad=6,max=Math.max(1,...pts);
  const x=i=>pts.length===1?w/2:pad+i*(w-pad*2)/(pts.length-1);
  const y=v=>h-pad-(v/max)*(h-pad*2);
  const line=pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area=`${line} L${x(pts.length-1).toFixed(1)},${h} L${x(0).toFixed(1)},${h} Z`;
  const bw=(w-pad*2)/Math.max(1,pts.length);
  const hits=(daily||[]).map((d,i)=>`<rect class="hit" x="${(x(i)-bw/2).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${h}" fill="transparent"><title>${esc(d.day)}: ${d.credits} credits</title></rect>`).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Daily credits for the last 30 days">
    <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--accent)" stop-opacity=".26"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#fill)"/><path class="ln" d="${line}"/>${hits}</svg>
  <div class="legend"><span>${esc((daily[0]||{}).day||"")}</span><span>peak ${max}</span><span>${esc((daily[daily.length-1]||{}).day||"")}</span></div>`;
}

  <section class="panel"><div class="panel-hd"><h2>Create a key</h2></div><div class="panel-bd">
    <div class="cols even" style="gap:14px">
      <div class="field"><label for="kname">Name</label><input type="text" id="kname" value="default"/><span class="hint">Where this key will be used, for example "staging worker".</span></div>
      <div class="cols even" style="gap:14px">
        <div class="field"><label for="krpm">Requests per minute</label><input type="number" id="krpm" value="60" min="1" max="1000"/></div>
        <div class="field"><label for="kcap">Monthly cap</label><input type="number" id="kcap" value="0" min="0"/><span class="hint">0 means no cap.</span></div>
      </div>
    </div>
    <div class="row"><button class="btn primary" id="kcreate"><i class="ph ph-plus" aria-hidden="true"></i>Create key</button></div>
  </div></section>
  <section class="panel"><div class="panel-hd"><h2>${keys.length} key${keys.length===1?"":"s"}</h2></div>
    ${keys.length?`<table><thead><tr><th>Name</th><th>Prefix</th><th>Req / min</th><th>Monthly cap</th><th>Used</th><th>Last used</th><th></th></tr></thead><tbody>
    ${keys.map(k=>`<tr>
      <td>${esc(k.name||"")}<span class="sub2 mono">${esc(k.id.slice(0,8))}</span></td>
      <td class="mono">${esc(k.key_prefix)}</td>
      <td><input class="tiny" type="number" data-k="rpm" data-id="${k.id}" value="${k.rate_limit_per_min}" min="1" max="1000" style="width:78px" aria-label="Requests per minute"/></td>
      <td><input class="tiny" type="number" data-k="cap" data-id="${k.id}" value="${k.monthly_limit}" min="0" style="width:88px" aria-label="Monthly cap"/></td>
      <td class="num">${k.used_month??0}</td>
      <td class="mono" style="color:var(--ink-3)">${k.last_used_at?shortDate(k.last_used_at):"never"}</td>
      <td style="white-space:nowrap;text-align:right">${k.is_active
        ?`<button class="btn sm" data-act="save" data-id="${k.id}">Save</button> <button class="btn sm danger" data-act="revoke" data-id="${k.id}">Revoke</button>`
        :`<span class="chip bad">revoked</span>`}</td></tr>`).join("")}
    </tbody></table>`:`<div class="empty"><i class="ph ph-key" aria-hidden="true"></i><b>No keys yet</b><p>Create your first key above, then paste it into the playground or your SDK client.</p></div>`}
  </section>`;

  $("#kcreate").onclick=async e=>{
    const btn=e.currentTarget;btn.disabled=true;
    try{
      const {status,j}=await api("/dashboard/keys",{method:"POST",body:JSON.stringify({
        name:$("#kname").value,rateLimitPerMin:Number($("#krpm").value),monthlyLimit:Number($("#kcap").value)})});
      if(!j.success){$("#banner").innerHTML=`<div class="callout err"><i class="ph ph-warning-circle" aria-hidden="true"></i><span>${esc(j.error||("Request failed with HTTP "+status))}</span></div>`;return;}
      try{localStorage.setItem("fc_lastkey",j.data.key);}catch{}
      await vKeys(el);
      const slot=$("#banner",el);
      if(slot){
        slot.innerHTML=`<div class="reveal-key"><b><i class="ph-fill ph-seal-check" aria-hidden="true" style="color:var(--ok)"></i> Copy this key now. It is not shown again.</b>
          <code>${esc(j.data.key)}</code><button class="btn sm" id="copyk"><i class="ph ph-copy" aria-hidden="true"></i>Copy key</button></div>`;
        $("#copyk",el).onclick=ev=>copy(j.data.key,ev.currentTarget);
      }
    }finally{btn.disabled=false;}
  };
  $$("button[data-act]",el).forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id;
    if(b.dataset.act==="save"){
      const rpm=$(`input[data-k="rpm"][data-id="${id}"]`,el).value;
      const cap=$(`input[data-k="cap"][data-id="${id}"]`,el).value;
      const {j}=await api(`/dashboard/keys/${id}`,{method:"PATCH",body:JSON.stringify({rateLimitPerMin:Number(rpm),monthlyLimit:Number(cap)})});
      if(!j.success)return toast(j.error||"Could not save the key.","bad");
      toast("Limits saved.");return;
    }
    if(!confirm("Revoke this key? Calls using it will start failing with 403."))return;
    const {j}=await api(`/dashboard/keys/${id}`,{method:"DELETE"});
    if(!j.success)return toast(j.error||"Could not revoke the key.","bad");
    toast("Key revoked.");vKeys(el);
  });
}

async function vPeople(el){
  if(ROLE()!=="admin"){el.innerHTML=`<div class="callout err"><i class="ph ph-lock-key" aria-hidden="true"></i><span>This section is admin only.</span></div>`;return;}
  const {j}=await api("/dashboard/users");
  const people=j.success?j.data:[];
  el.innerHTML=`
  <div class="head"><div><h1>People</h1><p>Invite a teammate. They set their own password the first time they open the link.</p></div></div>
  <div id="banner"></div>
  <section class="panel"><div class="panel-hd"><h2>Invite a teammate</h2></div><div class="panel-bd">
    <div class="field" style="max-width:420px"><label for="iemail">Email</label><input type="email" id="iemail" placeholder="teammate@company.com"/>
      <span class="hint">You get a link to copy and send. Nothing is emailed yet.</span></div>
    <div class="row"><button class="btn primary" id="inv"><i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>Create invite link</button></div>
  </div></section>
  <section class="panel"><div class="panel-hd"><h2>${people.length} member${people.length===1?"":"s"}</h2></div>
    <table><thead><tr><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
    ${people.map(p=>`<tr>
      <td>${esc(p.email)}</td>
      <td><span class="chip${p.role==="admin"?" accent":""}">${esc(p.role)}</span></td>
      <td>${p.active?`<span class="chip ok">active</span>`:`<span class="chip warn">invite pending</span>`}</td>
      <td style="text-align:right;white-space:nowrap">${p.active
        ?`<button class="btn sm" data-reset="${esc(p.email)}">Reset password</button>`
        :`<button class="btn sm" data-re="${esc(p.email)}">New link</button>`}</td>
    </tr>`).join("")||`<tr><td colspan="4"><div class="empty"><i class="ph ph-users-three" aria-hidden="true"></i><b>Just you so far</b><p>Invite the people who need keys and usage visibility.</p></div></td></tr>`}
    </tbody></table>
  </section>`;

  const showLink=async(j,label)=>{
    await vPeople(el);
    const slot=$("#banner",el);
    if(!slot)return;
    slot.innerHTML=`<div class="reveal-key"><b><i class="ph-fill ph-link" aria-hidden="true" style="color:var(--accent)"></i> ${esc(label)} for ${esc(j.data.email)}, valid until ${esc((j.data.expiresAt||"").slice(0,10))}</b>
      <code>${esc(j.data.inviteUrl)}</code><button class="btn sm" id="copyk"><i class="ph ph-copy" aria-hidden="true"></i>Copy link</button></div>`;
    $("#copyk",el).onclick=ev=>copy(j.data.inviteUrl,ev.currentTarget);
  };
  const fail=m=>{const s=$("#banner",el);if(s)s.innerHTML=`<div class="callout err"><i class="ph ph-warning-circle" aria-hidden="true"></i><span>${esc(m)}</span></div>`;};
  const send=async email=>{
    if(!email)return fail("Enter an email address first.");
    const {status,j}=await api("/dashboard/users/invite",{method:"POST",body:JSON.stringify({email})});
    if(!j.success)return fail(j.error||("Request failed with HTTP "+status));
    showLink(j,"Invite link");
  };
  const reset=async email=>{
    if(!confirm("Reset the password for "+email+"? Their current password stops working and you get a fresh link."))return;
    const {status,j}=await api("/dashboard/users/reset-password",{method:"POST",body:JSON.stringify({email})});
    if(!j.success)return fail(j.error||("Request failed with HTTP "+status));
    showLink(j,"Password reset link");
  };
  $("#inv",el).onclick=()=>send($("#iemail",el).value.trim());
  $$("button[data-re]",el).forEach(b=>b.onclick=()=>send(b.dataset.re));
  $$("button[data-reset]",el).forEach(b=>b.onclick=()=>reset(b.dataset.reset));
}

render();
</script>
</body>
</html>
