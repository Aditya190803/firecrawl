name: Deploy CF Worker

on:
  push:
    branches:
      - main
    paths:
      - 'apps/cf-workers/**'
      - 'apps/cf-console/**'
      - '.github/workflows/deploy-cf-workers.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Expose the secret as an env var for `if:` gating — `secrets.*` is not
  # allowed in step-level `if:` (job-level `if: secrets.X` marks the whole
  # run failed when unset). Empty string when the secret is not configured.
  HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify:
    name: Verify worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cf-workers
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/firecrawl-worker-build
      - name: Verify console mirrors
        run: |
          cmp public/index.html ../cf-console/index.html
          cmp public/index.html ../cf-console/public/index.html

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: verify
    defaults:
      run:
        working-directory: apps/cf-workers
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps
      - name: Deploy firecrawl-cf
        if: ${{ env.HAS_CF_TOKEN != '' }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Warn when Cloudflare secrets are missing
        if: ${{ env.HAS_CF_TOKEN == '' }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN not set — skipping deploy (verify passed)."
      - name: Verify live health
        if: ${{ env.HAS_CF_TOKEN != '' }}
        run: curl -fsS --max-time 30 https://firecrawl-cf.aditya-mer.workers.dev/health
