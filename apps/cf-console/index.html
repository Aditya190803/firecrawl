<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Firecrawl on Cloudflare Workers</title>
<meta name="description" content="The web data API to search, scrape, and crawl at scale, running on Cloudflare Workers. Clean markdown for agents, with open docs and a live playground." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
<meta property="og:title" content="Firecrawl on Cloudflare Workers" />
<meta property="og:description" content="Search, scrape, map, and crawl the web from one API. Docs and playground are open, no account needed." />
<meta property="og:type" content="website" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" />
<style>
/* Palette, type scale, radii and button treatment follow the Firecrawl design
   language (heat ramp on #fa5d19, alpha ramps, faint hairlines, 1112px container).
   Suisse Int'l is proprietary, so Inter stands in for the sans. */
:root{
  color-scheme:light;
  --heat-4:#fa5d190a; --heat-8:#fa5d1914; --heat-12:#fa5d191f; --heat-16:#fa5d1929;
  --heat-20:#fa5d1933; --heat-24:#fa5d193d; --heat-40:#fa5d1966; --heat-90:#fa5d19e6; --heat-100:#fa5d19;
  --accent-black:#262626; --accent-white:#ffffff;
  --surface:#ffffff; --surface-raised:#ffffff;
  --accent-crimson:#eb3424; --accent-forest:#42c366; --accent-honey:#ecb730; --accent-bluetron:#2a6dfb;
  --alpha-1:#00000003; --alpha-2:#00000005; --alpha-3:#00000008; --alpha-4:#0000000a;
  --alpha-5:#0000000d; --alpha-6:#0000000f; --alpha-7:#00000012; --alpha-8:#00000014;
  --alpha-10:#0000001a; --alpha-12:#0000001f; --alpha-16:#00000029; --alpha-20:#00000033;
  --alpha-24:#0000003d; --alpha-32:#26262652; --alpha-40:#26262666; --alpha-48:#2626267a;
  --alpha-56:#2626268f; --alpha-64:#262626a3; --alpha-72:#262626b8; --alpha-88:#262626e0;
  --border-faint:#ededed; --border-muted:#e8e8e8; --border-loud:#e6e6e6;
  --background-base:#f9f9f9; --background-lighter:#fbfbfb;
  --container:1112px;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",ui-sans-serif,system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
:root[data-theme="dark"],
html.dark{
  color-scheme:dark;
  --accent-black:#f5f5f5; --surface:#171717; --surface-raised:#1f1f1f;
  --accent-crimson:#f05545; --accent-forest:#5cd47f; --accent-honey:#f0c550; --accent-bluetron:#5a8ffc;
  --alpha-1:#ffffff03; --alpha-2:#ffffff05; --alpha-3:#ffffff08; --alpha-4:#ffffff0a;
  --alpha-5:#ffffff0d; --alpha-6:#ffffff0f; --alpha-7:#ffffff12; --alpha-8:#ffffff14;
  --alpha-10:#ffffff1a; --alpha-12:#ffffff1f; --alpha-16:#ffffff29; --alpha-20:#ffffff33;
  --alpha-24:#ffffff3d; --alpha-32:#ffffff52; --alpha-40:#ffffff66; --alpha-48:#ffffff7a;
  --alpha-56:#ffffff8f; --alpha-64:#ffffffa3; --alpha-72:#ffffffb8; --alpha-88:#ffffffe0;
  --border-faint:#2a2a2a; --border-muted:#333333; --border-loud:#404040;
  --background-base:#0a0a0a; --background-lighter:#141414;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --accent-black:#f5f5f5; --surface:#171717; --surface-raised:#1f1f1f;
    --accent-crimson:#f05545; --accent-forest:#5cd47f; --accent-honey:#f0c550; --accent-bluetron:#5a8ffc;
    --alpha-1:#ffffff03; --alpha-2:#ffffff05; --alpha-3:#ffffff08; --alpha-4:#ffffff0a;
    --alpha-5:#ffffff0d; --alpha-6:#ffffff0f; --alpha-7:#ffffff12; --alpha-8:#ffffff14;
    --alpha-10:#ffffff1a; --alpha-12:#ffffff1f; --alpha-16:#ffffff29; --alpha-20:#ffffff33;
    --alpha-24:#ffffff3d; --alpha-32:#ffffff52; --alpha-40:#ffffff66; --alpha-48:#ffffff7a;
    --alpha-56:#ffffff8f; --alpha-64:#ffffffa3; --alpha-72:#ffffffb8; --alpha-88:#ffffffe0;
    --border-faint:#2a2a2a; --border-muted:#333333; --border-loud:#404040;
    --background-base:#0a0a0a; --background-lighter:#141414;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
html,body{margin:0;min-height:100%}
body{background:var(--background-base);color:var(--accent-black);font-family:var(--sans);
  font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
p{margin:0}
h1,h2,h3,h4{margin:0;font-weight:500}
:focus-visible{outline:2px solid var(--heat-100);outline-offset:2px;border-radius:6px}

/* type scale */
.t-h1{font-size:60px;line-height:64px;font-weight:500;letter-spacing:-.3px}
.t-h2{font-size:36px;line-height:40px;font-weight:500;letter-spacing:-.36px}
.t-h4{font-size:32px;line-height:36px;font-weight:500;letter-spacing:-.32px}
.t-h5{font-size:24px;line-height:32px;font-weight:500;letter-spacing:-.24px}
.t-h6{font-size:18px;line-height:24px;font-weight:500;letter-spacing:-.09px}
.body-large{font-size:18px;line-height:26px;letter-spacing:-.09px;color:var(--alpha-64)}
.body-medium{font-size:14px;line-height:20px;letter-spacing:.14px;color:var(--alpha-64)}
.body-small{font-size:13px;line-height:20px;color:var(--alpha-56)}
.label-medium{font-size:14px;line-height:20px;font-weight:500}
.label-small{font-size:13px;line-height:20px;font-weight:500}
.label-xs{font-size:12px;line-height:20px;font-weight:500}
.mono,code,pre{font-family:var(--mono)}
.mono-small{font-family:var(--mono);font-size:13px;line-height:20px;font-weight:500}
.heat{color:var(--heat-100)}
.muted{color:var(--alpha-56)}

/* layout rails, the faint hairline grid of the reference design */
.container{width:min(calc(100% - 32px),var(--container));margin:0 auto;position:relative}
.rails{position:relative}
.rails:before,.rails:after{content:"";position:absolute;top:0;bottom:0;width:1px;background:var(--border-faint);pointer-events:none}
.rails:before{left:0}.rails:after{right:0}
.hair{height:1px;background:var(--border-faint);width:100%}
.section{padding:64px 0;border-bottom:1px solid var(--border-faint)}
.section-head{display:flex;flex-direction:column;gap:12px;margin-bottom:40px}
.seclabel{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--alpha-40)}
.seclabel b{color:var(--alpha-56);font-weight:500}
.seclabel .num{color:var(--heat-100)}

/* buttons, matching the reference treatment */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;isolation:isolate;
  font-family:inherit;font-size:14px;line-height:20px;font-weight:500;cursor:pointer;border:0;border-radius:10px;
  padding:8px 14px;transition:background .15s ease,box-shadow .15s ease,transform .06s ease;white-space:nowrap}
.btn i{font-size:16px}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn-primary{background:#ff4c00;color:#fff;
  box-shadow:inset 0 -6px 12px #f003,0 2px 4px #ff4d001f,0 1px 1px #ff4d001f,0 .5px .5px #ff4d0029,0 .25px .25px #ff4d0033}
.btn-primary:before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.06;
  background:linear-gradient(#fff,#0000);z-index:-1;transition:opacity .2s}
.btn-primary:hover{box-shadow:inset 0 -6px 12px #f003,0 4px 8px #ff4d0029,0 1px 1px #ff4d001f,0 .5px .5px #ff4d0029,0 .25px .25px #ff4d0033}
.btn-primary:hover:before{opacity:.12}
.btn-secondary{background:var(--alpha-4);color:var(--accent-black)}
.btn-secondary:hover{background:var(--alpha-6)}
.btn-secondary:active{background:var(--alpha-7)}
.btn-ghost{background:transparent;color:var(--alpha-64)}
.btn-ghost:hover{background:var(--alpha-4);color:var(--accent-black)}
.btn-danger{background:var(--alpha-4);color:var(--accent-crimson)}
.btn-danger:hover{background:var(--alpha-6)}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn-lg{padding:12px 18px;font-size:16px;line-height:24px}
.btn-icon{padding:8px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--border-faint);border-radius:16px;position:relative}
.card-pad{padding:20px}
.ticks:before,.ticks:after,.ticks>.tick:before,.ticks>.tick:after{content:"";position:absolute;width:5px;height:5px;
  border-color:var(--border-loud);border-style:solid;border-width:0;pointer-events:none}
.ticks:before{top:-1px;left:-1px;border-top-width:1px;border-left-width:1px}
.ticks:after{top:-1px;right:-1px;border-top-width:1px;border-right-width:1px}
.ticks>.tick:before{bottom:-1px;left:-1px;border-bottom-width:1px;border-left-width:1px}
.ticks>.tick:after{bottom:-1px;right:-1px;border-bottom-width:1px;border-right-width:1px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border-faint);background:var(--surface);
  border-radius:999px;padding:4px 4px 4px 12px;font-size:12px;font-weight:500;color:var(--alpha-72);transition:border-color .2s}
.pill:hover{border-color:var(--alpha-16)}
.pill .go{width:18px;height:18px;border-radius:999px;background:var(--accent-black);display:grid;place-items:center;
  color:var(--surface);font-size:11px;transition:background .2s}
.pill:hover .go{background:var(--heat-100);color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:500;
  font-family:var(--mono);background:var(--alpha-4);color:var(--alpha-64)}
.tag.ok{background:#42c3661f;color:var(--accent-forest)}
.tag.bad{background:#eb34241f;color:var(--accent-crimson)}
.tag.warn{background:#ecb7301f;color:var(--accent-honey)}
.tag.heat{background:var(--heat-12);color:var(--heat-100)}
.dot{width:6px;height:6px;border-radius:999px;background:var(--alpha-24)}
.dot.up{background:var(--accent-forest)}.dot.down{background:var(--accent-crimson)}

/* announcement + nav */
.announce{border-bottom:1px solid var(--border-faint);background:var(--background-lighter)}
.announce .container{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;
  font-size:13px;color:var(--alpha-64)}
.announce b{font-weight:500;color:var(--accent-black)}
.announce a{color:var(--heat-100);font-weight:500}
.announce a:hover{text-decoration:underline}
.nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--background-base) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--border-faint)}
.nav .container{display:flex;align-items:center;gap:16px;height:60px}
.logo{display:flex;align-items:center;gap:8px}
.logo svg{width:24px;height:24px;display:block}
.logo b{font-size:15px;font-weight:600;letter-spacing:-.2px}
.navlinks{display:flex;align-items:center;gap:2px;margin-left:16px}
.navlinks a{padding:6px 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--accent-black);transition:background .15s}
.navlinks a:hover{background:var(--alpha-4)}
.navlinks a.on{background:var(--alpha-6)}
.navright{margin-left:auto;display:flex;align-items:center;gap:8px}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--border-faint)}
.hero:before{content:"";position:absolute;inset:-20% 0 auto;height:560px;pointer-events:none;
  background:radial-gradient(46% 60% at 50% 0%,var(--heat-16),transparent 72%)}
.hero .container{padding:56px 0 0;text-align:center;position:relative;padding-bottom:0}
.hero h1{max-width:18ch;margin:0 auto 16px}
.hero .lede{max-width:52ch;margin:0 auto}
.hero .cta{display:flex;justify-content:center;gap:12px;margin-top:28px;flex-wrap:wrap}
.hero .badge{display:flex;justify-content:center;margin-bottom:20px}

/* hero playground card */
.play{margin:48px auto -64px;text-align:left;position:relative;z-index:2;box-shadow:0 24px 48px -32px #26262633}
.play .head{display:flex;align-items:center;gap:4px;padding:10px 12px;border-bottom:1px solid var(--border-faint);flex-wrap:wrap}
.play .head .tabs{display:flex;gap:2px}
.play .head .tabs button{font:inherit;font-size:13px;font-weight:500;color:var(--alpha-56);background:transparent;border:0;
  border-radius:8px;padding:6px 10px;cursor:pointer;transition:background .15s,color .15s}
.play .head .tabs button:hover{background:var(--alpha-4);color:var(--accent-black)}
.play .head .tabs button[aria-pressed="true"]{background:var(--alpha-6);color:var(--accent-black)}
.play .head .live{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--alpha-40)}
.play .bar{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--border-faint)}
.play .bar input{flex:1}
.play .outwrap{position:relative;background:var(--background-lighter);border-radius:0 0 16px 16px;overflow:hidden}
.code{display:grid;grid-template-columns:44px minmax(0,1fr);font-family:var(--mono);font-size:12.5px;line-height:20px;
  max-height:300px;overflow:auto}
.code .gut{padding:12px 0;text-align:right;color:var(--alpha-24);user-select:none;border-right:1px solid var(--border-faint)}
.code .gut span{display:block;padding-right:10px}
.code pre{margin:0;padding:12px 14px;white-space:pre-wrap;word-break:break-word;color:var(--alpha-72)}
.tok-key{color:var(--heat-100)}
.tok-str{color:var(--accent-forest)}
.tok-num{color:var(--accent-bluetron)}
.tok-lit{color:var(--alpha-40)}

/* inputs */
input[type=text],input[type=password],input[type=email],input[type=number],textarea,select{
  width:100%;font-family:inherit;font-size:14px;line-height:20px;color:var(--accent-black);background:var(--surface);
  border:1px solid var(--border-muted);border-radius:10px;padding:8px 12px;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--alpha-32)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--heat-40);box-shadow:0 0 0 3px var(--heat-8)}
textarea{min-height:82px;resize:vertical;font-family:var(--mono);font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label,.flabel{font-size:13px;font-weight:500;color:var(--alpha-64)}
.field .hint{font-size:12px;color:var(--alpha-40)}

/* feature grid */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--border-faint);
  border:1px solid var(--border-faint);border-radius:16px;overflow:hidden}
.grid3 .cell{background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:10px;transition:background .2s}
.grid3 .cell:hover{background:var(--background-lighter)}
.grid3 .cell i{font-size:20px;color:var(--heat-100)}
.grid3 .cell .k{font-family:var(--mono);font-size:12px;color:var(--alpha-40)}
.grid3 .cell a{font-size:13px;font-weight:500;color:var(--heat-100);margin-top:auto}
.grid3 .cell a:hover{text-decoration:underline}

/* code sample block */
.sample{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:32px;align-items:center}
.codecard .head{display:flex;align-items:center;gap:2px;padding:8px 10px;border-bottom:1px solid var(--border-faint)}
.codecard .head button{font:inherit;font-size:13px;font-weight:500;color:var(--alpha-56);background:transparent;border:0;
  border-radius:8px;padding:5px 9px;cursor:pointer}
.codecard .head button:hover{background:var(--alpha-4);color:var(--accent-black)}
.codecard .head button[aria-pressed="true"]{background:var(--alpha-6);color:var(--accent-black)}
.codecard .head .cp{margin-left:auto}

/* limits */
.limits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--border-faint);
  border:1px solid var(--border-faint);border-radius:16px;overflow:hidden}
.limits .cell{background:var(--surface);padding:22px 24px;display:flex;flex-direction:column;gap:6px}
.limits .cell .k{font-family:var(--mono);font-size:12px;color:var(--heat-100)}
.limits .cell .v{font-size:18px;font-weight:500;letter-spacing:-.09px}

/* closing band */
.band{border:1px solid var(--border-faint);border-radius:20px;background:var(--surface);position:relative;overflow:hidden;
  padding:48px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.band:before{content:"";position:absolute;inset:auto 0 -60% 0;height:280px;
  background:radial-gradient(50% 60% at 50% 100%,var(--heat-16),transparent 70%);pointer-events:none}

/* footer */
footer{padding:48px 0 40px}
footer .cols{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:32px}
footer h4{font-size:12px;font-weight:500;color:var(--alpha-40);margin:0 0 12px;font-family:var(--mono)}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
footer li a{font-size:13px;color:var(--alpha-64)}
footer li a:hover{color:var(--accent-black)}
footer .legal{margin-top:36px;padding-top:20px;border-top:1px solid var(--border-faint);display:flex;gap:12px;
  flex-wrap:wrap;font-size:12px;color:var(--alpha-40)}

/* docs */
.keybar{position:sticky;top:60px;z-index:30;background:color-mix(in srgb,var(--background-base) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border-faint)}
.keybar .container{display:flex;align-items:center;gap:12px;height:56px}
.keybar label{font-size:13px;font-weight:500;color:var(--alpha-64);white-space:nowrap}
.keybar input{max-width:340px;font-family:var(--mono);font-size:13px}
.keybar .state{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--alpha-40)}
.docs{display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;padding:40px 0 72px}
.docnav{position:sticky;top:140px;align-self:start;display:flex;flex-direction:column;gap:1px;max-height:calc(100dvh - 180px);overflow:auto}
.docnav h4{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--alpha-40);margin:16px 0 6px}
.docnav h4:first-child{margin-top:0}
.docnav a{font-size:13.5px;color:var(--alpha-64);padding:6px 10px;border-radius:8px}
.docnav a:hover{background:var(--alpha-4);color:var(--accent-black)}
.ep{padding-top:40px;margin-top:40px;border-top:1px solid var(--border-faint)}
.ep .sig{display:flex;align-items:center;gap:8px;margin-top:10px}
.ep .desc{margin-top:12px;max-width:64ch}
.ep .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:20px;align-items:start}
.params{margin-top:20px;border:1px solid var(--border-faint);border-radius:12px;overflow:hidden;background:var(--surface)}
.params .p{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:16px;padding:12px 16px}
.params .p + .p{border-top:1px solid var(--border-faint)}
.params .n{font-family:var(--mono);font-size:13px}
.params .n em{font-style:normal;display:block;color:var(--alpha-40);font-size:12px;margin-top:2px}
.params .d{font-size:13.5px;color:var(--alpha-64)}
.try{margin-top:20px;border:1px solid var(--border-faint);border-radius:16px;background:var(--surface);overflow:hidden}
.try .hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border-faint)}
.try .hd .note{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--alpha-40)}
.try .bd{padding:16px}

/* console */
.top{position:sticky;top:0;z-index:40;height:60px;display:flex;align-items:center;gap:16px;padding:0 20px;
  background:color-mix(in srgb,var(--background-base) 88%,transparent);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-faint)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.host{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--alpha-56);
  border:1px solid var(--border-faint);background:var(--surface);border-radius:999px;padding:5px 12px;max-width:320px}
.host b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100dvh - 60px)}
.side{border-right:1px solid var(--border-faint);padding:16px 12px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:60px;height:calc(100dvh - 60px);background:var(--background-lighter)}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:500;
  color:var(--alpha-64);transition:background .15s,color .15s}
.side a i{font-size:17px}
.side a:hover{background:var(--alpha-4);color:var(--accent-black)}
.side a[aria-current="page"]{background:var(--heat-8);color:var(--heat-100)}
.side .who{margin-top:auto;border-top:1px solid var(--border-faint);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.side .who .mail{font-size:12px;color:var(--alpha-56);word-break:break-all}
.main{padding:28px 32px 72px;max-width:1180px;min-width:0}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.head .acts{margin-left:auto;display:flex;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--border-faint);
  border:1px solid var(--border-faint);border-radius:16px;overflow:hidden;margin-bottom:16px}
.stats .cell{background:var(--surface);padding:18px 20px}
.stats .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--alpha-56)}
.stats .k i{font-size:14px;color:var(--alpha-32)}
.stats .v{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.4px;margin-top:8px;font-variant-numeric:tabular-nums}
.stats .s{font-size:12px;color:var(--alpha-40);margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--border-faint);border-radius:16px;overflow:hidden}
.panel + .panel{margin-top:16px}
.panel .ph{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border-faint)}
.panel .ph .note{margin-left:auto;font-size:12px;color:var(--alpha-40)}
.panel .pb{padding:18px}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--alpha-40);padding:10px 18px;
  border-bottom:1px solid var(--border-faint);background:var(--background-lighter)}
td{padding:12px 18px;border-bottom:1px solid var(--border-faint)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--alpha-2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub2{display:block;font-size:12px;color:var(--alpha-40);margin-top:2px}
.callout{display:flex;gap:10px;border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:14px;line-height:20px}
.callout i{font-size:17px;flex-shrink:0}
.callout.err{background:#eb34241a;color:var(--accent-crimson)}
.callout.info{background:var(--alpha-3);color:var(--alpha-64);border:1px solid var(--border-faint)}
.keyout{border:1px solid var(--heat-24);background:var(--heat-4);border-radius:12px;padding:16px;margin-bottom:14px}
.keyout b{display:block;font-size:13.5px;margin-bottom:10px;font-weight:500}
.keyout code{display:block;font-size:13px;background:var(--surface);border:1px solid var(--border-faint);border-radius:8px;
  padding:10px 12px;word-break:break-all;margin-bottom:10px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:36px 20px}
.empty i{font-size:24px;color:var(--alpha-24)}
.empty b{font-size:14px;font-weight:500}
.empty p{font-size:13px;color:var(--alpha-56);max-width:44ch}
.sk{background:linear-gradient(90deg,var(--alpha-3),var(--alpha-6),var(--alpha-3));background-size:200% 100%;border-radius:8px;height:14px}
.chart{width:100%;height:148px;display:block}
.chart .ln{fill:none;stroke:var(--heat-100);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .hit:hover{fill:var(--heat-8)}
.legend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--alpha-40);margin-top:8px}

/* auth */
.auth{display:grid;place-items:center;padding:72px 16px;min-height:calc(100dvh - 60px)}
.authbox{width:min(400px,100%)}
.authbox .top-mark{display:flex;justify-content:center;margin-bottom:20px}
.authbox h1{text-align:center}
.authbox .lede{text-align:center;margin-top:8px;margin-bottom:24px}

/* toasts */
.toasts{position:fixed;right:16px;bottom:16px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border-muted);
  border-radius:12px;padding:10px 14px;font-size:13.5px;box-shadow:0 8px 24px -12px #00000029;max-width:330px}
.toast i{font-size:17px}
.toast.ok i{color:var(--accent-forest)}.toast.bad i{color:var(--accent-crimson)}

/* motion */
@media (prefers-reduced-motion: no-preference){
  .rise{animation:rise .5s var(--ease) backwards}
  .rise.d1{animation-delay:.06s}.rise.d2{animation-delay:.12s}.rise.d3{animation-delay:.18s}
  [data-reveal]{opacity:0;transform:translateY(14px)}
  [data-reveal].in{opacity:1;transform:none;transition:opacity .55s var(--ease),transform .55s var(--ease)}
  .toast{animation:rise .2s var(--ease)}
  .sk{animation:sh 1.4s linear infinite}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:995px){
  :root{--container:100%}
  .t-h1{font-size:44px;line-height:48px;letter-spacing:-.22px}
  .t-h2{font-size:28px;line-height:32px}
  .t-h4{font-size:22px;line-height:26px}
  .rails:before,.rails:after{display:none}
  .grid3,.limits{grid-template-columns:minmax(0,1fr)}
  .sample,.cols,.cols.even,.ep .two{grid-template-columns:minmax(0,1fr);gap:20px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .docs{grid-template-columns:minmax(0,1fr);gap:20px;padding-top:24px}
  .docnav{position:static;flex-direction:row;flex-wrap:wrap;gap:6px;max-height:none}
  .docnav h4{display:none}
  .docnav a{border:1px solid var(--border-faint);border-radius:999px}
  footer .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .navlinks{display:none}
  .announce .container{font-size:12px;text-align:center}
  .layout{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border-faint)}
  .side .who{margin:0 0 0 auto;border-top:0;padding:0;flex-direction:row;align-items:center}
  .side .who .mail{display:none}
  .main{padding:20px 16px 56px}
  .host{display:none}
  .params .p{grid-template-columns:minmax(0,1fr);gap:4px}
  .keybar .state{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script>
"use strict";

/* ---------------- primitives ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
/* Served from the Worker custom domain, so the origin is the API. Mirrored on Pages,
   where the origin is not the API: fall back to the Worker domain there. */
const WORKER_ORIGIN="https://firecrawl.adityamer.dev";
const API=()=>(localStorage.getItem("fc_base")
  ||(/\.pages\.dev$/.test(location.hostname)?WORKER_ORIGIN:window.location.origin)).replace(/\/$/,"");
const TOKEN=()=>localStorage.getItem("fc_token")||"";
const ROLE=()=>localStorage.getItem("fc_role")||"";
const EMAIL=()=>localStorage.getItem("fc_email")||"";
const KEY=()=>localStorage.getItem("fc_lastkey")||"";
const MARK=`<svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="fcT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#e2430f"/></linearGradient><linearGradient id="fcC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a8"/><stop offset="1" stop-color="#ff7a2f"/></linearGradient></defs><rect width="32" height="32" rx="7.5" fill="url(#fcT)"/><path fill="#fff" d="M17.3 3.4c.5 3.1-.6 5.2-2.6 7.2-2.6 2.5-4.8 4.6-4.8 8.1a6.1 6.1 0 0 0 12.2.3c0-2.6-1.1-4.2-2-5.7.9.2 1.7.7 2.3 1.4.3-3.9-1.7-8.2-5.1-11.3Z"/><path fill="url(#fcC)" d="M16.1 16.1c.6 1.7 2.4 2.4 2.4 4.3a2.8 2.8 0 0 1-5.6.1c0-1.4.8-2.2 1.5-3 .6-.7 1.2-1.4 1.7-1.4Z"/></svg>`;
const logo=()=>`<a class="logo" href="#/">${MARK}<b>Firecrawl</b></a>`;
const ticks=()=>`<span class="tick"></span>`;

const authH=()=>({"content-type":"application/json",...(TOKEN()?{authorization:"Bearer "+TOKEN()}:{})});
async function api(path,opts={}){
  const r=await fetch(API()+path,{...opts,headers:{...(opts.headers||{}),...authH()}});
  const j=await r.json().catch(()=>({success:false,error:"Response was not JSON."}));
  if(r.status===401&&path.startsWith("/dashboard/")&&!path.includes("accept-invite")&&!path.includes("login")){
    logout();location.hash="#/login";
  }
  return {status:r.status,j};
}
function logout(){["fc_token","fc_email","fc_role"].forEach(k=>localStorage.removeItem(k));}
function remember(d){localStorage.setItem("fc_token",d.token);localStorage.setItem("fc_email",d.email);if(d.role)localStorage.setItem("fc_role",d.role);}

function toast(msg,kind="ok"){
  const el=document.createElement("div");
  el.className="toast "+kind;
  el.innerHTML=`<i class="ph-fill ${kind==="bad"?"ph-warning-circle":"ph-check-circle"}" aria-hidden="true"></i><span>${esc(msg)}</span>`;
  $("#toasts").appendChild(el);
  setTimeout(()=>el.remove(),3200);
}
function copy(text,btn,label="Copied"){
  navigator.clipboard.writeText(text).then(()=>{
    toast(label);
    if(btn){const o=btn.innerHTML;btn.innerHTML=`<i class="ph ph-check" aria-hidden="true"></i>${label}`;setTimeout(()=>btn.innerHTML=o,1400);}
  }).catch(()=>toast("Clipboard blocked by the browser.","bad"));
}
function hl(text){
  return esc(text)
    .replace(/&quot;([^&]*?)&quot;(\s*:)/g,'<span class="tok-key">&quot;$1&quot;</span>$2')
    .replace(/:\s(&quot;.*?&quot;)/g,': <span class="tok-str">$1</span>')
    .replace(/:\s(-?\d+\.?\d*)/g,': <span class="tok-num">$1</span>')
    .replace(/:\s(true|false|null)/g,': <span class="tok-lit">$1</span>');
}
/* Code block with a line-number gutter, as on the reference site. */
function codeBlock(text,highlight=true){
  const lines=String(text).split("\n");
  return `<div class="code"><div class="gut">${lines.map((_,i)=>`<span>${i+1}</span>`).join("")}</div>
    <pre>${highlight?hl(text):esc(text)}</pre></div>`;
}
const jsonBlock=v=>codeBlock(JSON.stringify(v,null,2));
const shortDate=s=>esc(String(s||"").slice(0,16).replace("T"," "));
const skeleton=n=>`<div class="panel"><div class="pb">${Array.from({length:n},(_,i)=>
  `<div class="sk" style="width:${[92,70,84,58][i%4]}%;margin-bottom:12px"></div>`).join("")}</div></div>`;

let revealObserver=null;
function wireReveal(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  revealObserver?.disconnect();
  revealObserver=new IntersectionObserver((es,obs)=>{
    es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");obs.unobserve(e.target);}});
  },{threshold:.12});
  $$("[data-reveal]").forEach(el=>revealObserver.observe(el));
}

/* ---------------- theme ---------------- */
function theme(){return localStorage.getItem("fc_theme")||"system";}
function applyTheme(){
  const t=theme();
  if(t==="system")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
}
function cycleTheme(){
  const order=["system","light","dark"];
  localStorage.setItem("fc_theme",order[(order.indexOf(theme())+1)%3]);
  applyTheme();render();toast("Theme: "+theme());
}
const themeIcon=()=>({system:"ph-circle-half",light:"ph-sun",dark:"ph-moon"})[theme()];
const themeBtn=()=>`<button class="btn btn-ghost btn-icon" id="themeBtn" title="Theme: ${theme()}" aria-label="Change theme"><i class="ph ${themeIcon()}" aria-hidden="true"></i></button>`;
applyTheme();

/* ---------------- endpoint catalog ---------------- */
const EPS=[
  {id:"scrape",group:"Scraping",title:"Scrape",method:"POST",path:"/v2/scrape",icon:"ph-file-text",
   blurb:"Get LLM ready data from any page. Markdown, HTML, text, or links.",
   params:[["url","string, required","Absolute URL. A bare host gets https:// added."],
           ["formats","array","Any of markdown, html, rawHtml, text, links, summary."],
           ["onlyMainContent","boolean","Strips navigation and footers. On by default."],
           ["timeout","number","Milliseconds, up to 120000."]],
   form:[["url","text","https://example.com"],["formats","textarea",'[{"type":"markdown"}]']],
   example:{url:"https://example.com",formats:[{type:"markdown"}]}},
  {id:"crawl",group:"Scraping",title:"Crawl",method:"POST",path:"/v2/crawl",icon:"ph-tree-structure",async:"crawl",
   blurb:"Walk a whole site from one URL and scrape every page it finds.",
   params:[["url","string, required","Where the crawl starts."],
           ["limit","number","Maximum pages. Defaults to 100."],
           ["maxDepth","number","Link depth from the start URL. Defaults to 5."],
           ["excludePaths","array","Path patterns to skip."]],
   form:[["url","text","https://example.com"],["limit","number","5"],["maxDepth","number","2"]],
   example:{url:"https://example.com",limit:20,maxDepth:2}},
  {id:"batch",group:"Scraping",title:"Batch scrape",method:"POST",path:"/v2/batch/scrape",icon:"ph-stack",async:"batch/scrape",
   blurb:"Scrape a list of URLs in one job with the same options as a scrape.",
   params:[["urls","array, required","Up to 1000 URLs."],
           ["formats","array","Applied to every URL in the batch."],
           ["maxConcurrency","number","Up to 10 pages at a time."]],
   form:[["urls","textarea","https://example.com\nhttps://example.org"]],
   example:{urls:["https://example.com","https://example.org"]}},
  {id:"map",group:"Discovery",title:"Map",method:"POST",path:"/v2/map",icon:"ph-sitemap",
   blurb:"List every URL on a site from its sitemap and homepage links.",
   params:[["url","string, required","Site to map."],
           ["limit","number","Maximum URLs returned."],
           ["search","string","Keep only URLs containing this text."],
           ["includeSubdomains","boolean","On by default."]],
   form:[["url","text","https://example.com"],["limit","number","10"]],
   example:{url:"https://example.com",limit:50}},
  {id:"search",group:"Discovery",title:"Search",method:"POST",path:"/v2/search",icon:"ph-magnifying-glass",
   blurb:"Search the web and get full content from the results.",
   params:[["query","string, required","What to search for."],
           ["limit","number","Results to return. Defaults to 10."],
           ["country","string","Two letter country code."],
           ["scrapeOptions","object","Scrape each result as well."]],
   form:[["query","text","firecrawl workers"],["limit","number","5"]],
   example:{query:"firecrawl",limit:5}},
  {id:"extract",group:"AI",title:"Extract",method:"POST",path:"/v2/extract",icon:"ph-brackets-curly",
   blurb:"Pull structured fields out of pages with Workers AI and a prompt.",
   params:[["urls","array, required","Pages to read. A single url also works."],
           ["prompt","string","What to pull out of each page."],
           ["schema","object","JSON shape the answer should follow."]],
   form:[["urls","textarea","https://example.com"],["prompt","text","What is this page about?"]],
   example:{urls:["https://example.com"],prompt:"Give the product name and price."}},
  {id:"summarize",group:"AI",title:"Summarize",method:"POST",path:"/v2/summarize",icon:"ph-article",
   blurb:"Short summary of a page. Falls back to extractive when AI is off.",
   params:[["url","string, required","Page to summarize."],
           ["sentences","number","Between 1 and 10. Defaults to 3."]],
   form:[["url","text","https://example.com"],["sentences","number","3"]],
   example:{url:"https://example.com",sentences:3}},
  {id:"status",group:"Jobs",title:"Job status",method:"GET",path:"/v2/crawl/:jobId",icon:"ph-clock-countdown",
   blurb:"Status, progress, data, and per-page errors for a crawl or batch job.",
   params:[["jobId","string, required","Returned by crawl and batch scrape."]],
   form:[["jobId","text",""]],
   raw:b=>`/v2/crawl/${b.jobId}`,example:null},
];
const EP=id=>EPS.find(e=>e.id===id);
const buildBody=(spec,read)=>{
  const o={};
  spec.form.forEach(([name,kind])=>{
    const v=read(name);
    if(name==="formats"){try{o.formats=JSON.parse(v)}catch{o.formats=[{type:"markdown"}]}}
    else if(name==="urls"){o.urls=v.split("\n").map(s=>s.trim()).filter(Boolean)}
    else if(kind==="number"){if(v!=="")o[name]=Number(v)}
    else o[name]=v;
  });
  return o;
};
const curlFor=(spec,body)=>{
  const path=spec.raw?spec.raw(body):spec.path;
  return spec.method==="GET"
    ? `curl -s ${API()}${path} \\\n  -H "Authorization: Bearer $FIRECRAWL_KEY"`
    : `curl -s -X ${spec.method} ${API()}${spec.path} \\\n  -H "Authorization: Bearer $FIRECRAWL_KEY" \\\n  -H "content-type: application/json" \\\n  -d '${JSON.stringify(body)}'`;
};

/* ---------------- routing ---------------- */
const CONSOLE_PAGES={
  "/overview":{title:"Overview",icon:"ph-chart-line-up",view:vOverview},
  "/keys":{title:"API keys",icon:"ph-key",view:vKeys},
  "/people":{title:"People",icon:"ph-users-three",view:vPeople,admin:true},
};
function parseRoute(){
  const raw=(location.hash||"#/").slice(1);
  const inv=raw.match(/^\/invite\/(.+)$/);
  if(inv)return {name:"/invite",token:decodeURIComponent(inv[1])};
  const [path,anchor]=raw.split("#");
  if(path==="/"||path==="")return {name:"/",anchor};
  return {name:path,anchor};
}
const setTitle=t=>document.title=t?t+" · Firecrawl":"Firecrawl on Cloudflare Workers";

let renderedRoute=null;
async function render(){
  const r=parseRoute();
  const isConsole=!!CONSOLE_PAGES[r.name];
  if(isConsole&&!TOKEN()){location.hash="#/login";return;}
  if(r.name==="/login"&&TOKEN()){location.hash="#/overview";return;}
  if(renderedRoute===r.name&&r.anchor){
    const same=document.getElementById(r.anchor);
    if(same){same.scrollIntoView();return;}
  }
  if(r.name==="/"){setTitle("");vLanding();}
  else if(r.name==="/docs"){setTitle("Docs");vDocs();}
  else if(r.name==="/login"){setTitle("Sign in");vLogin();}
  else if(r.name==="/invite"){setTitle("Set your password");vInvite(r.token);}
  else if(isConsole){
    const page=CONSOLE_PAGES[r.name];
    setTitle(page.title+" · Console");
    $("#root").innerHTML=consoleChrome(skeleton(5));
    wireConsole();
    await page.view($("#view"));
  }
  else{location.hash="#/";return;}
  renderedRoute=r.name;
  wireReveal();
  const target=r.anchor&&document.getElementById(r.anchor);
  if(target)target.scrollIntoView();else window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

/* ---------------- public chrome ---------------- */
function siteHeader(current){
  const right=TOKEN()
    ? `<a class="btn btn-secondary btn-sm" href="#/overview"><i class="ph ph-gauge" aria-hidden="true"></i>Console</a>`
    : `<a class="btn btn-primary btn-sm" href="#/login">Sign in</a>`;
  return `<div class="announce"><div class="container">
      <b>Docs and playground are open.</b><span>No account needed to run a request.</span>
      <a href="#/docs">Open the docs</a>
    </div></div>
    <header class="nav"><div class="container">
      ${logo()}
      <nav class="navlinks">
        <a href="#/docs" class="${current==="docs"?"on":""}">Docs</a>
        <a href="#/docs#playground">Playground</a>
        <a href="#/docs#errors">Errors</a>
      </nav>
      <div class="navright">${themeBtn()}${right}</div>
    </div></header>`;
}
function siteFooter(){
  return `<div class="hair"></div><footer><div class="container rails" style="padding:0 24px">
    <div class="cols">
      <div>${logo()}
        <p class="body-small" style="margin-top:12px;max-width:34ch">The web data API to search, scrape, and crawl at scale, running on Cloudflare Workers, D1, KV, and Queues.</p>
      </div>
      <div><h4>Endpoints</h4><ul>
        <li><a href="#/docs#scrape">Scrape</a></li><li><a href="#/docs#crawl">Crawl</a></li>
        <li><a href="#/docs#map">Map</a></li><li><a href="#/docs#search">Search</a></li></ul></div>
      <div><h4>Reference</h4><ul>
        <li><a href="#/docs#auth">Authentication</a></li><li><a href="#/docs#playground">Playground</a></li>
        <li><a href="#/docs#errors">Error codes</a></li><li><a href="/docs">Machine catalog</a></li></ul></div>
      <div><h4>Account</h4><ul>
        <li><a href="#/login">Sign in</a></li><li><a href="/health">Health</a></li></ul></div>
    </div>
    <div class="legal"><span>Self-hosted Firecrawl on Cloudflare Workers.</span>
      <a href="https://github.com/firecrawl/firecrawl" target="_blank" rel="noreferrer">Firecrawl is open source.</a></div>
  </div></footer>`;
}
function wireSite(){
  const t=$("#themeBtn");if(t)t.onclick=cycleTheme;
}
async function pulse(){
  const d=$("#pulse"),t=$("#pulsetxt");if(!d)return;
  try{const r=await fetch(API()+"/health");d.className="dot "+(r.ok?"up":"down");if(t)t.textContent=r.ok?"live":"HTTP "+r.status;}

function drawPlay(){
  const tabs=$("#playTabs"),input=$("#playInput"),out=$("#playOut");
  const defaults={scrape:"https://example.com",crawl:"https://example.com",map:"https://example.com",search:"firecrawl workers"};
  const paint=()=>{
    tabs.innerHTML=HERO_TABS.map(id=>`<button type="button" data-t="${id}" aria-pressed="${id===heroTab}">${esc(EP(id).title)}</button>`).join("");
    $$("button",tabs).forEach(b=>b.onclick=()=>{heroTab=b.dataset.t;paint();});
    input.value=defaults[heroTab];
    input.placeholder=heroTab==="search"?"Search query":"https://example.com";
    out.innerHTML=codeBlock(JSON.stringify(EP(heroTab).example,null,2));
  };
  paint();
  $("#playRun").onclick=async ev=>{
    const btn=ev.currentTarget,spec=EP(heroTab),v=input.value.trim();
    if(!v){toast("Enter a value first.","bad");return;}
    const body=spec.id==="search"?{query:v,limit:5}
      :spec.id==="scrape"?{url:v,formats:[{type:"markdown"}]}
      :spec.id==="map"?{url:v,limit:10}
      :{url:v,limit:5,maxDepth:2};
    btn.disabled=true;out.innerHTML=codeBlock("Waiting for the worker...",false);
    const t0=performance.now();
    try{
      const r=await fetch(API()+spec.path,{method:"POST",
        headers:{"content-type":"application/json",...(KEY()?{authorization:"Bearer "+KEY()}:{})},
        body:JSON.stringify(body)});
      const j=await r.json().catch(()=>({}));
      const ms=Math.round(performance.now()-t0);
      const md=j&&j.data&&j.data.markdown;
      out.innerHTML=codeBlock(r.ok&&md
        ? `// HTTP ${r.status} in ${ms} ms\n\n`+md.slice(0,900)
        : JSON.stringify(j,null,2));
      if(r.status===401)toast("Add a key in the playground to run this.","bad");
    }catch(e){out.innerHTML=codeBlock(e.message,false);}
    finally{btn.disabled=false;}
  };
}

const pollTimers={};
function docKey(){const f=$("#dkey");return ((f&&f.value)||KEY()).trim();}
async function runEndpoint(spec,read,btn){
  const out=$("#out_"+spec.id),meta=$("#meta_"+spec.id),pollBox=$("#poll_"+spec.id);
  clearInterval(pollTimers[spec.id]);pollBox.innerHTML="";
  const body=buildBody(spec,read);
  if(spec.id==="status"&&!body.jobId){
    meta.innerHTML=`<span class="tag bad">jobId missing</span>`;
    out.innerHTML=codeBlock("Run a crawl or a batch scrape first, then paste the job ID here.",false);return;
  }
  btn.disabled=true;out.innerHTML=codeBlock("Waiting for the worker...",false);
  const t0=performance.now();
  try{
    const key=docKey();
    const path=spec.raw?spec.raw(body):spec.path;
    const opts={method:spec.method,headers:{"content-type":"application/json",...(key?{authorization:"Bearer "+key}:{})}};
    if(spec.method!=="GET")opts.body=JSON.stringify(body);
    const r=await fetch(API()+path,opts);
    const j=await r.json().catch(()=>({}));
    paintResp(spec.id,r.status,Math.round(performance.now()-t0),j);
    if(r.status===401)toast("That request needs a valid API key.","bad");
    if(j&&j.id&&spec.async)startPoll(spec,j.id);
  }catch(e){
    meta.innerHTML=`<span class="tag bad">failed</span>`;
    out.innerHTML=codeBlock(e.message,false);
  }finally{btn.disabled=false;}
}
function paintResp(id,status,ms,j){
  const ok=status>=200&&status<300;
  const size=new Blob([JSON.stringify(j)]).size;
  $("#meta_"+id).innerHTML=`<span class="tag ${ok?"ok":"bad"}">HTTP ${status}</span>`
    +`<span class="mono" style="font-size:12px">${ms?ms+" ms":""} ${size>1024?(size/1024).toFixed(1)+" kB":size+" B"}</span>`;
  $("#out_"+id).innerHTML=jsonBlock(j);
}
function startPoll(spec,jobId){
  const box=$("#poll_"+spec.id),t0=Date.now();
  const jobField=$("#f_status_jobId");if(jobField)jobField.value=jobId;
  pollTimers[spec.id]=setInterval(async()=>{
    box.innerHTML=`<div class="callout info" style="margin:0"><i class="ph ph-arrows-clockwise" aria-hidden="true"></i><span>Polling ${esc(spec.async)}/${esc(jobId)} for ${Math.round((Date.now()-t0)/1000)}s</span></div>`;
    try{
      const key=docKey();
      const r=await fetch(`${API()}/v2/${spec.async}/${jobId}`,{headers:key?{authorization:"Bearer "+key}:{}});
      const j=await r.json();
      paintResp(spec.id,r.status,0,j);
      if(["completed","failed","cancelled"].includes(j.status)){
        clearInterval(pollTimers[spec.id]);box.innerHTML="";toast("Job "+j.status+".",j.status==="completed"?"ok":"bad");
      }
    }catch{}
    if(Date.now()-t0>120000){
      clearInterval(pollTimers[spec.id]);
      box.innerHTML=`<div class="callout info" style="margin:0"><i class="ph ph-clock-countdown" aria-hidden="true"></i><span>Stopped polling after 2 minutes. The job may still be running.</span></div>`;
    }
  },2500);
}

    const v=prompt("API base URL for this browser. Leave blank to use this origin.",localStorage.getItem("fc_base")||"");
    if(v===null)return;
    if(v.trim())localStorage.setItem("fc_base",v.trim());else localStorage.removeItem("fc_base");
    render();
  };
  const d=$("#pulse");
  if(d)fetch(API()+"/health").then(r=>{d.className="dot "+(r.ok?"up":"down");}).catch(()=>{d.className="dot down";});
}

function areaChart(daily){
  const pts=(daily||[]).map(d=>d.credits);
  if(!pts.length)return `<div class="empty"><i class="ph ph-chart-line" aria-hidden="true"></i><b>No traffic yet</b><p>Run a request from the playground and the daily curve shows up here.</p></div>`;
  const w=600,h=148,pad=6,max=Math.max(1,...pts);
  const x=i=>pts.length===1?w/2:pad+i*(w-pad*2)/(pts.length-1);
  const y=v=>h-pad-(v/max)*(h-pad*2);
  const line=pts.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const area=`${line} L${x(pts.length-1).toFixed(1)},${h} L${x(0).toFixed(1)},${h} Z`;
  const bw=(w-pad*2)/Math.max(1,pts.length);
  const hits=(daily||[]).map((d,i)=>`<rect class="hit" x="${(x(i)-bw/2).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${h}" fill="transparent"><title>${esc(d.day)}: ${d.credits} credits</title></rect>`).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Daily credits for the last 30 days">
    <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fa5d19" stop-opacity=".22"/><stop offset="1" stop-color="#fa5d19" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#fill)"/><path class="ln" d="${line}"/>${hits}</svg>
  <div class="legend"><span>${esc((daily[0]||{}).day||"")}</span><span>peak ${max}</span><span>${esc((daily[daily.length-1]||{}).day||"")}</span></div>`;
}
const jobTag=s=>s==="completed"?`<span class="tag ok">completed</span>`
  :s==="failed"?`<span class="tag bad">failed</span>`
  :s==="cancelled"?`<span class="tag">cancelled</span>`
  :`<span class="tag warn">${esc(s)}</span>`;

async function vOverview(el){
  const [{j:me},{j:usage},{j:jobs}]=await Promise.all([
    api("/dashboard/auth/me"),api("/dashboard/usage?days=30"),api("/dashboard/jobs?limit=15")]);
  if(!me.success){el.innerHTML=`<div class="callout err"><i class="ph ph-warning-circle" aria-hidden="true"></i><span>${esc(me.error||"Could not load your account.")}</span></div>`;return;}
  if(me.data.role)localStorage.setItem("fc_role",me.data.role);
  const d=me.data,u=usage.success?usage.data:{total:{credits:0,requests:0},daily:[],byEndpoint:[],byKey:[]};
  const list=jobs.success?jobs.data:[];
  const running=list.filter(x=>x.status==="queued"||x.status==="active").length;
  el.innerHTML=`
  <div class="head">
    <div><h1 class="t-h5">Overview</h1><p class="body-medium">Team <span class="mono">${esc((d.teamId||"").slice(0,8))}</span> over the last 30 days.</p></div>
    <div class="acts"><a class="btn btn-secondary" href="#/docs#playground"><i class="ph ph-play-circle" aria-hidden="true"></i>Open playground</a></div>
  </div>
  <div class="stats">
    <div class="cell"><div class="k"><i class="ph ph-coins" aria-hidden="true"></i>Credits</div><div class="v">${u.total.credits}</div><div class="s">last 30 days</div></div>
    <div class="cell"><div class="k"><i class="ph ph-arrows-left-right" aria-hidden="true"></i>Requests</div><div class="v">${u.total.requests}</div><div class="s">last 30 days</div></div>
    <div class="cell"><div class="k"><i class="ph ph-calendar-blank" aria-hidden="true"></i>This month</div><div class="v">${d.creditsUsedMonth}</div><div class="s">${d.creditsLimit?"cap "+d.creditsLimit:"no cap set"}</div></div>
    <div class="cell"><div class="k"><i class="ph ph-spinner-gap" aria-hidden="true"></i>Active jobs</div><div class="v">${running}</div><div class="s">queued or running</div></div>
  </div>
  <div class="cols">
    <section class="panel"><div class="ph"><b class="label-medium">Daily credits</b><span class="note">hover a day for the exact count</span></div>
      <div class="pb">${areaChart(u.daily)}</div></section>
    <section class="panel"><div class="ph"><b class="label-medium">By endpoint</b></div>
      ${(u.byEndpoint||[]).length?`<table><thead><tr><th>endpoint</th><th>requests</th><th>credits</th></tr></thead><tbody>
        ${u.byEndpoint.map(x=>`<tr><td class="mono">${esc(x.endpoint)}</td><td class="num">${x.requests}</td><td class="num">${x.credits}</td></tr>`).join("")}
      </tbody></table>`:`<div class="empty"><i class="ph ph-list-dashes" aria-hidden="true"></i><b>Nothing recorded</b><p>Endpoint totals appear after your first authenticated call.</p></div>`}
    </section>
  </div>
  <section class="panel" style="margin-top:16px"><div class="ph"><b class="label-medium">Usage by key</b><a class="note" href="#/keys">Manage keys</a></div>
    ${(u.byKey||[]).length?`<table><thead><tr><th>key</th><th>requests</th><th>credits</th></tr></thead><tbody>
      ${u.byKey.map(x=>`<tr><td>${esc(x.name)}<span class="sub2 mono">${esc(x.prefix)}</span></td><td class="num">${x.requests}</td><td class="num">${x.credits}</td></tr>`).join("")}
    </tbody></table>`:`<div class="empty"><i class="ph ph-key" aria-hidden="true"></i><b>No key traffic yet</b><p>Create a key, then call the API with it to see per-key spend.</p></div>`}
  </section>
  <section class="panel"><div class="ph"><b class="label-medium">Recent jobs</b><span class="note">crawl and batch runs</span></div>
    ${list.length?`<table><thead><tr><th>job</th><th>kind</th><th>status</th><th>progress</th><th>created</th></tr></thead><tbody>
      ${list.map(x=>`<tr><td class="mono">${esc(x.id.slice(0,8))}</td><td>${esc(x.kind)}</td><td>${jobTag(x.status)}</td>
        <td class="num">${x.completed} / ${x.total}</td><td class="mono muted">${shortDate(x.created_at)}</td></tr>`).join("")}
    </tbody></table>`:`<div class="empty"><i class="ph ph-stack" aria-hidden="true"></i><b>No jobs yet</b><p>Crawls and batch scrapes you start will be listed here with live progress.</p></div>`}
  </section>`;
}

async function vKeys(el){
  const {j}=await api("/dashboard/keys");
  const keys=j.success?j.data:[];
  el.innerHTML=`
  <div class="head"><div><h1 class="t-h5">API keys</h1><p class="body-medium">Each key carries its own rate limit and monthly cap. The secret is shown once.</p></div></div>
  <div id="banner"></div>
  <section class="panel"><div class="ph"><b class="label-medium">Create a key</b></div><div class="pb">
    <div class="cols even">
      <div class="field"><label for="kname">Name</label><input type="text" id="kname" value="default"/><span class="hint">Where this key will be used, for example "staging worker".</span></div>
      <div class="cols even">
        <div class="field"><label for="krpm">Requests per minute</label><input type="number" id="krpm" value="60" min="1" max="1000"/></div>
        <div class="field"><label for="kcap">Monthly cap</label><input type="number" id="kcap" value="0" min="0"/><span class="hint">0 means no cap.</span></div>
      </div>
    </div>
    <div class="row"><button class="btn btn-primary" id="kcreate"><i class="ph ph-plus" aria-hidden="true"></i>Create key</button></div>
  </div></section>
  <section class="panel"><div class="ph"><b class="label-medium">${keys.length} key${keys.length===1?"":"s"}</b></div>
    ${keys.length?`<table><thead><tr><th>name</th><th>prefix</th><th>req / min</th><th>monthly cap</th><th>used</th><th>last used</th><th></th></tr></thead><tbody>
    ${keys.map(k=>`<tr>
      <td>${esc(k.name||"")}<span class="sub2 mono">${esc(k.id.slice(0,8))}</span></td>
      <td class="mono">${esc(k.key_prefix)}</td>
      <td><input type="number" data-k="rpm" data-id="${k.id}" value="${k.rate_limit_per_min}" min="1" max="1000" style="width:82px;padding:6px 8px;font-family:var(--mono);font-size:13px" aria-label="Requests per minute"/></td>
      <td><input type="number" data-k="cap" data-id="${k.id}" value="${k.monthly_limit}" min="0" style="width:92px;padding:6px 8px;font-family:var(--mono);font-size:13px" aria-label="Monthly cap"/></td>
      <td class="num">${k.used_month??0}</td>
      <td class="mono muted">${k.last_used_at?shortDate(k.last_used_at):"never"}</td>
      <td style="white-space:nowrap;text-align:right">${k.is_active
        ?`<button class="btn btn-secondary btn-sm" data-act="save" data-id="${k.id}">Save</button> <button class="btn btn-danger btn-sm" data-act="revoke" data-id="${k.id}">Revoke</button>`
        :`<span class="tag bad">revoked</span>`}</td></tr>`).join("")}
    </tbody></table>`:`<div class="empty"><i class="ph ph-key" aria-hidden="true"></i><b>No keys yet</b><p>Create your first key above, then paste it into the playground or your SDK client.</p></div>`}
  </section>`;

  $("#kcreate").onclick=async e=>{
    const btn=e.currentTarget;btn.disabled=true;
    try{
      const {status,j}=await api("/dashboard/keys",{method:"POST",body:JSON.stringify({
        name:$("#kname").value,rateLimitPerMin:Number($("#krpm").value),monthlyLimit:Number($("#kcap").value)})});
      if(!j.success){$("#banner").innerHTML=`<div class="callout err"><i class="ph ph-warning-circle" aria-hidden="true"></i><span>${esc(j.error||("Request failed with HTTP "+status))}</span></div>`;return;}
      try{localStorage.setItem("fc_lastkey",j.data.key);}catch{}
      await vKeys(el);
      const slot=$("#banner",el);
      if(slot){
        slot.innerHTML=`<div class="keyout"><b>Copy this key now. It is not shown again.</b>
          <code>${esc(j.data.key)}</code><button class="btn btn-secondary btn-sm" id="copyk"><i class="ph ph-copy" aria-hidden="true"></i>Copy key</button></div>`;
        $("#copyk",el).onclick=ev=>copy(j.data.key,ev.currentTarget);
      }
    }finally{btn.disabled=false;}
  };
  $$("button[data-act]",el).forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id;
    if(b.dataset.act==="save"){
      const rpm=$(`input[data-k="rpm"][data-id="${id}"]`,el).value;
      const cap=$(`input[data-k="cap"][data-id="${id}"]`,el).value;
      const {j}=await api(`/dashboard/keys/${id}`,{method:"PATCH",body:JSON.stringify({rateLimitPerMin:Number(rpm),monthlyLimit:Number(cap)})});
      if(!j.success)return toast(j.error||"Could not save the key.","bad");
      toast("Limits saved.");return;
    }
    if(!confirm("Revoke this key? Calls using it will start failing with 403."))return;
    const {j}=await api(`/dashboard/keys/${id}`,{method:"DELETE"});
    if(!j.success)return toast(j.error||"Could not revoke the key.","bad");
    toast("Key revoked.");vKeys(el);
  });
}

async function vPeople(el){
  if(ROLE()!=="admin"){el.innerHTML=`<div class="callout err"><i class="ph ph-lock-key" aria-hidden="true"></i><span>This section is admin only.</span></div>`;return;}
  const {j}=await api("/dashboard/users");
  const people=j.success?j.data:[];
  el.innerHTML=`
  <div class="head"><div><h1 class="t-h5">People</h1><p class="body-medium">Invite a teammate. They set their own password the first time they open the link.</p></div></div>
  <div id="banner"></div>
  <section class="panel"><div class="ph"><b class="label-medium">Invite a teammate</b></div><div class="pb">
    <div class="field" style="max-width:420px"><label for="iemail">Email</label><input type="email" id="iemail" placeholder="teammate@company.com"/>
      <span class="hint">You get a link to copy and send. Nothing is emailed yet.</span></div>
    <div class="row"><button class="btn btn-primary" id="inv"><i class="ph ph-paper-plane-tilt" aria-hidden="true"></i>Create invite link</button></div>
  </div></section>
  <section class="panel"><div class="ph"><b class="label-medium">${people.length} member${people.length===1?"":"s"}</b></div>
    <table><thead><tr><th>email</th><th>role</th><th>status</th><th></th></tr></thead><tbody>
    ${people.map(p=>`<tr>
      <td>${esc(p.email)}</td>
      <td><span class="tag${p.role==="admin"?" heat":""}">${esc(p.role)}</span></td>
      <td>${p.active?`<span class="tag ok">active</span>`:`<span class="tag warn">invite pending</span>`}</td>
      <td style="text-align:right;white-space:nowrap">${p.active
        ?`<button class="btn btn-secondary btn-sm" data-reset="${esc(p.email)}">Reset password</button>`
        :`<button class="btn btn-secondary btn-sm" data-re="${esc(p.email)}">New link</button>`}</td>
    </tr>`).join("")||`<tr><td colspan="4"><div class="empty"><i class="ph ph-users-three" aria-hidden="true"></i><b>Just you so far</b><p>Invite the people who need keys and usage visibility.</p></div></td></tr>`}
    </tbody></table>
  </section>`;

  const showLink=async(j,label)=>{
    await vPeople(el);
    const slot=$("#banner",el);
    if(!slot)return;
    slot.innerHTML=`<div class="keyout"><b>${esc(label)} for ${esc(j.data.email)}, valid until ${esc((j.data.expiresAt||"").slice(0,10))}</b>
      <code>${esc(j.data.inviteUrl)}</code><button class="btn btn-secondary btn-sm" id="copyk"><i class="ph ph-copy" aria-hidden="true"></i>Copy link</button></div>`;
    $("#copyk",el).onclick=ev=>copy(j.data.inviteUrl,ev.currentTarget);
  };
  const fail=m=>{const s=$("#banner",el);if(s)s.innerHTML=`<div class="callout err"><i class="ph ph-warning-circle" aria-hidden="true"></i><span>${esc(m)}</span></div>`;};
  const send=async email=>{
    if(!email)return fail("Enter an email address first.");
    const {status,j}=await api("/dashboard/users/invite",{method:"POST",body:JSON.stringify({email})});
    if(!j.success)return fail(j.error||("Request failed with HTTP "+status));
    showLink(j,"Invite link");
  };
  const reset=async email=>{
    if(!confirm("Reset the password for "+email+"? Their current password stops working and you get a fresh link."))return;
    const {status,j}=await api("/dashboard/users/reset-password",{method:"POST",body:JSON.stringify({email})});
    if(!j.success)return fail(j.error||("Request failed with HTTP "+status));
    showLink(j,"Password reset link");
  };
  $("#inv",el).onclick=()=>send($("#iemail",el).value.trim());
  $$("button[data-re]",el).forEach(b=>b.onclick=()=>send(b.dataset.re));
  $$("button[data-reset]",el).forEach(b=>b.onclick=()=>reset(b.dataset.reset));
}

render();
</script>
